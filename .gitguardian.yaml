# GitGuardian configuration.
#
# This repository contains no real credentials and never should. What the
# scanner finds is the local-development database password used by
# deploy/docker-compose.yml, which creates a throwaway container on a
# developer's own machine.
#
# The right response to a secret scanner is to remove the secret, not to
# silence the scanner, so that was done first: application.yaml no longer
# carries a default password at all, because a fallback credential is a
# credential -- an unset DATABASE_PASSWORD in a deployed environment should
# stop the service, not make it try something guessable. What remains is a
# compose default that exists so `docker compose up` stays one command.
#
# Every genuine secret is an environment variable supplied at deploy time:
# see deploy/.env.example for the full list and deploy/render.yaml for how
# they are set in production.

version: 2

secret:
  ignored-matches:
    # The throwaway Postgres password in the local development stack. Both the
    # container and the database it protects live and die on one developer's
    # machine and are reachable from nowhere else.
    - name: local docker-compose postgres password
      match: lms

  ignored-paths:
    # Documents which variables exist and what shape they take. Every value in
    # it is blank or a placeholder, by design -- it is the file that tells a
    # deployer what to set, not a file that sets anything.
    - deploy/.env.example
    # Generated build output; never committed, but excluded so a local scan of
    # a dirty working tree does not spend time on it.
    - backend/target/**
    - frontend/dist/**
    - frontend/node_modules/**
