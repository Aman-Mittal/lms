OtpIssued:
  type: object
  properties:
    expiresAt: { type: string, format: date-time }
    otp:
      type: string
      description: The six-digit code. Present only where the deployment exposes
        it (a demo); otherwise absent, because the code belongs to the consignee.
  required: [expiresAt]

RecordDeliveryProofRequest:
  type: object
  properties:
    otp: { type: string, description: The code the consignee gave. }
    recipientName: { type: string, maxLength: 120 }
    photoRef:
      type: string
      maxLength: 500
      description: A reference to the photo (a URL or a storage key). The platform
        stores no file.
    deliveredAt:
      type: string
      format: date-time
      description: When it was delivered; now if omitted. Not in the future.
    lat: { type: number, minimum: -90, maximum: 90 }
    lon:
      type: number
      minimum: -180
      maximum: 180
      description: Give both a latitude and a longitude, or neither.
    goodsCondition:
      $ref: "#/components/schemas/GoodsCondition"
    remark:
      type: string
      maxLength: 500
      description: What was short or damaged. Required (`proof-remark-required`)
        unless the goods were received clean; ignored when they were.
  required: [otp, recipientName]

GoodsCondition:
  type: string
  enum: [CLEAN, SHORTAGE, DAMAGE]
  default: CLEAN
  description: |
    The state the goods were received in. Anything but CLEAN keeps the
    carrier's trip from settling until a person releases the hold.

DeliveryProof:
  type: object
  properties:
    consignmentId: { type: string, format: uuid }
    status:
      type: string
      enum: [PENDING, OTP_ISSUED, CONFIRMED, SUBMITTED, NOT_RECEIVED, REVERSED]
      description: |
        PENDING is a draft being fed; OTP_ISSUED a code waiting to be matched.
        CONFIRMED (recorded in one step by code) and SUBMITTED (a fed draft
        submitted, by code or from paper) both prove the delivery. NOT_RECEIVED:
        the consignee took nothing; it may still be fed and submitted. REVERSED
        once an approved reversal undid a proof; a fresh code may be issued.
    recipientName: { type: string }
    photoRef: { type: string }
    deliveredAt: { type: string, format: date-time }
    lat: { type: number }
    lon: { type: number }
    otpExpiresAt: { type: string, format: date-time }
    goodsCondition: { $ref: "#/components/schemas/GoodsCondition" }
    remark:
      type: string
      description: What was short or damaged; absent for a clean delivery.
    paper:
      type: boolean
      description: Keyed by staff from the signed paper copy, with no code.
    keyedBy: { type: string, format: uuid, description: Who keyed a paper proof. }
    reportedAt: { type: string, format: date-time }
    unloadingStartedAt: { type: string, format: date-time }
    unloadingEndedAt: { type: string, format: date-time }
    lines:
      type: array
      description: Every order line of the consignment, with what was fed to it.
      items: { $ref: "#/components/schemas/DeliveryProofLine" }
    documents:
      type: array
      items: { $ref: "#/components/schemas/DeliveryProofDocument" }

DeliveryProofLine:
  type: object
  properties:
    orderLineId: { type: string, format: uuid }
    lineNo: { type: integer }
    materialDescription: { type: string }
    uom: { type: string }
    grossQty: { type: number, description: The order line's quantity. }
    receivedQty: { type: number, description: Absent until the line has been fed. }
    shortQty: { type: number }
    damagedQty: { type: number }
    excessQty: { type: number }
  required: [orderLineId, lineNo, grossQty]

ProofDocumentType:
  type: string
  enum: [FRONT, BACK, OTHER]

DeliveryProofDocument:
  type: object
  properties:
    type: { $ref: "#/components/schemas/ProofDocumentType" }
    reference: { type: string, maxLength: 500 }
  required: [type, reference]

FeedProofLine:
  type: object
  properties:
    orderLineId: { type: string, format: uuid }
    receivedQty: { type: number, minimum: 0 }
    shortQty: { type: number, minimum: 0 }
    damagedQty: { type: number, minimum: 0 }
    excessQty: { type: number, minimum: 0 }
  required: [orderLineId]

FeedProofLinesRequest:
  type: object
  properties:
    lines:
      type: array
      maxItems: 500
      items: { $ref: "#/components/schemas/FeedProofLine" }

SetProofDocumentsRequest:
  type: object
  properties:
    documents:
      type: array
      maxItems: 20
      items: { $ref: "#/components/schemas/DeliveryProofDocument" }

SetProofTimingsRequest:
  type: object
  properties:
    reportedAt: { type: string, format: date-time }
    unloadingStartedAt: { type: string, format: date-time }
    unloadingEndedAt: { type: string, format: date-time }

SubmitProofRequest:
  type: object
  properties:
    otp: { type: string }
    recipientName: { type: string, maxLength: 120 }
    deliveredAt: { type: string, format: date-time, description: Now if omitted. Not in the future. }
    lat: { type: number, minimum: -90, maximum: 90 }
    lon: { type: number, minimum: -180, maximum: 180 }
    goodsCondition: { $ref: "#/components/schemas/GoodsCondition" }
    remark: { type: string, maxLength: 500 }
  required: [otp, recipientName]

KeyPaperProofRequest:
  type: object
  properties:
    recipientName: { type: string, maxLength: 120 }
    deliveredAt: { type: string, format: date-time, description: Now if omitted. Not in the future. }
    lat: { type: number, minimum: -90, maximum: 90 }
    lon: { type: number, minimum: -180, maximum: 180 }
    goodsCondition: { $ref: "#/components/schemas/GoodsCondition" }
    remark: { type: string, maxLength: 500 }
  required: [recipientName]

NotReceivedRequest:
  type: object
  properties:
    remark: { type: string, maxLength: 500 }
  required: [remark]

ClaimType:
  type: string
  enum: [DAMAGE, SHORTAGE, LOSS, DELAY]

ClaimStatus:
  type: string
  enum: [OPEN, UNDER_REVIEW, APPROVED, REJECTED, SETTLED]

Claim:
  type: object
  properties:
    id: { type: string, format: uuid }
    claimNo: { type: string }
    consignmentId: { type: string, format: uuid }
    claimType: { $ref: "#/components/schemas/ClaimType" }
    amount: { type: number }
    currency: { type: string }
    description: { type: string }
    status: { $ref: "#/components/schemas/ClaimStatus" }
    approvedAmount: { type: number }
    resolutionNote: { type: string }
    decidedAt: { type: string, format: date-time }
    createdAt: { type: string, format: date-time }

ClaimSlice:
  type: object
  description: One page. No total and no page number -- both need the scan
    keyset pagination exists to avoid.
  properties:
    items:
      type: array
      items: { $ref: "#/components/schemas/Claim" }
    nextCursor:
      type: string
      description: Pass as `cursor` for the next page. Null on the last.
    hasMore: { type: boolean }
  required: [items, hasMore]

RaiseClaimRequest:
  type: object
  properties:
    consignmentId: { type: string, format: uuid }
    claimType: { $ref: "#/components/schemas/ClaimType" }
    amount: { type: number, exclusiveMinimum: 0 }
    description: { type: string, maxLength: 1000 }
  required: [consignmentId, claimType, amount, description]

TransitionClaimRequest:
  type: object
  properties:
    target: { $ref: "#/components/schemas/ClaimStatus" }
    approvedAmount:
      type: number
      description: Required to approve; more than zero and not more than claimed.
    resolutionNote:
      type: string
      description: Required to reject.
  required: [target]

ProofReversalRequest:
  type: object
  properties:
    reason: { type: string, maxLength: 500, description: Why the proof is wrong. Required. }
  required: [reason]
