# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

/api/v1/drivers:
  get:
    tags: [Drivers]
    operationId: listDrivers
    summary: A page of drivers
    description: |
      Paged by licence number rather than by name. Names are not unique -- two
      drivers called Ravi Kumar is ordinary -- and a cursor on a non-unique
      column skips rows at every page boundary.
    parameters:
      - $ref: "#/components/parameters/status"
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
    responses:
      "200":
        description: One page of drivers.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
  post:
    tags: [Drivers]
    operationId: registerDriver
    summary: Register a driver
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RegisterDriverRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/drivers/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Drivers]
    operationId: getDriver
    summary: One driver
    responses:
      "200":
        description: The driver.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Driver" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/drivers/{id}/documents:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Drivers]
    operationId: listDriverDocuments
    summary: Documents filed against a driver
    responses:
      "200":
        description: Documents, soonest expiry first.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/ComplianceDocument" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
  post:
    tags: [Drivers]
    operationId: attachDriverDocument
    summary: File a document against a driver
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AttachDocumentRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }
