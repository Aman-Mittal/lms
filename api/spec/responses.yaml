# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

NoContent:
  description: Done. Nothing to return.

Created:
  description: Created.
  content:
    application/json:
      schema: { $ref: "#/components/schemas/IdResponse" }

BadRequest:
  description: The request was malformed. Fix it and try again.
  content:
    application/problem+json:
      schema: { $ref: "#/components/schemas/Problem" }

Unauthorized:
  description: No token, or a token that does not verify.
  content:
    application/problem+json:
      schema: { $ref: "#/components/schemas/Problem" }

Forbidden:
  description: Authenticated, but without the permission this needs.
  content:
    application/problem+json:
      schema: { $ref: "#/components/schemas/Problem" }

NotFound:
  description: No such resource in this tenant.
  content:
    application/problem+json:
      schema: { $ref: "#/components/schemas/Problem" }

Conflict:
  description: |
    Well-formed, and the domain refused it -- an expired certificate
    blocking a dispatch, a load over vehicle capacity, an overlapping
    terminal. Deliberately not 400: this is not a mistake in the request,
    and reporting it as one sends the caller looking in the wrong place.

    Also the answer to losing a race. Two writers editing one aggregate at the
    same time (`code: concurrent-modification`), or two creating the same
    unique business key at the same time (`code: duplicate-resource`), leave
    the loser with this response: re-read the resource and decide again. The
    problem document never names a constraint, a table or a statement.
  content:
    application/problem+json:
      schema: { $ref: "#/components/schemas/Problem" }
