# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

ExceptionCategory:
  type: string
  description: |
    Decides the severity; it is never chosen per ticket.
    P1 -- ACCIDENT, THEFT, BREAKDOWN.
    P2 -- ROUTE_DEVIATION, EXTENDED_STOPPAGE, TEMPERATURE_EXCURSION,
          MISSED_CONNECTION.
    P3 -- ETA_DELAY, DOCUMENT_MISMATCH, MILK_RUN_STOP_SKIPPED,
          MILK_RUN_STOP_LATE, RECEIPT_VARIANCE, PICK_SHORTFALL.
    MISSED_CONNECTION, the milk-run and the warehouse categories are raised
    automatically from those modules' events.
  enum: [ACCIDENT, THEFT, BREAKDOWN, ROUTE_DEVIATION, EXTENDED_STOPPAGE,
         TEMPERATURE_EXCURSION, ETA_DELAY, DOCUMENT_MISMATCH,
         MISSED_CONNECTION, MILK_RUN_STOP_SKIPPED, MILK_RUN_STOP_LATE,
         RECEIPT_VARIANCE, PICK_SHORTFALL]

Exception:
  type: object
  properties:
    id: { type: string, format: uuid }
    ticketNo: { type: string }
    tripId:
      type: string
      format: uuid
      description: Null when the ticket is about something other than a
        trip; the subject fields then say what.
    tripNo: { type: string }
    vehicleId: { type: string, format: uuid }
    registrationNo: { type: string }
    subjectType:
      type: string
      enum: [ITINERARY, CIRCUIT_RUN, ASN, OUTBOUND_ORDER]
      description: What the ticket is about besides, or instead of, a trip.
        Always present when `tripId` is null.
    subjectId:
      type: string
      format: uuid
      description: The subject's identifier in its owning module.
    subjectLabel:
      type: string
      description: The subject's number or name, as read off the board.
    category: { $ref: "#/components/schemas/ExceptionCategory" }
    severity:
      type: string
      enum: [P1, P2, P3]
    status:
      type: string
      enum: [RAISED, ASSIGNED, UNDER_INVESTIGATION, RESOLVED, CLOSED]
    description: { type: string }
    source:
      type: string
      enum: [MANUAL, ROUTE_DEVIATION, MISSED_CONNECTION, MILK_RUN_STOP_SKIPPED,
             MILK_RUN_STOP_LATE, RECEIPT_VARIANCE, PICK_SHORTFALL]
    lat: { type: number }
    lon: { type: number }
    positionSource:
      type: string
      enum: [TELEMATICS, REPORTED, DETECTOR, NONE]
      description: Where the coordinates captured at raising came from.
    positionAt:
      type: string
      format: date-time
      description: When the captured position was true -- a stale fix says
        so rather than passing for current.
    suspendsSettlement:
      type: boolean
      description: True for P1 and P2 tickets on a trip. The trip's freight
        bill cannot be matched or settled until this ticket is closed. A
        ticket with no trip never suspends settlement.
    raisedBy: { type: string }
    raisedAt: { type: string, format: date-time }
    assigneeUserId: { type: string, format: uuid }
    assigneeName: { type: string }
    assignedAt: { type: string, format: date-time }
    resolution: { type: string }
    resolvedBy: { type: string }
    resolvedAt: { type: string, format: date-time }
    closedBy: { type: string }
    closedAt: { type: string, format: date-time }

ExceptionSlice:
  type: object
  description: One page, newest first. No total and no page number.
  properties:
    items:
      type: array
      items: { $ref: "#/components/schemas/Exception" }
    nextCursor:
      type: string
      description: Pass as `cursor` for the next page. Null on the last.
    hasMore: { type: boolean }
  required: [items, hasMore]

ExceptionActivity:
  type: object
  properties:
    action:
      type: string
      enum: [RAISED, ASSIGNED, INVESTIGATION_STARTED, RESOLVED, REOPENED, CLOSED]
    fromStatus: { type: string }
    toStatus: { type: string }
    note: { type: string }
    actor: { type: string }
    occurredAt: { type: string, format: date-time }

ExceptionSummary:
  type: object
  description: Counts over tickets that are not yet closed.
  properties:
    openP1: { type: integer }
    openP2: { type: integer }
    openP3: { type: integer }
    unassigned: { type: integer }
    settlementHolds:
      type: integer
      description: Open tickets currently freezing a vendor's settlement.
    openWithoutTrip:
      type: integer
      description: Open tickets about an itinerary, circuit run, ASN or
        outbound order rather than a trip.

RaiseExceptionRequest:
  type: object
  properties:
    tripId: { type: string, format: uuid }
    category: { $ref: "#/components/schemas/ExceptionCategory" }
    description: { type: string, minLength: 1 }
    lat:
      type: number
      minimum: -90
      maximum: 90
      description: Optional. Where the reporter says it happened; used when
        the vehicle has no fix from the last thirty minutes. Supply both
        or neither.
    lon: { type: number, minimum: -180, maximum: 180 }
  required: [tripId, category, description]

AssignExceptionRequest:
  type: object
  properties:
    assigneeUserId: { type: string, format: uuid }
    note: { type: string }
  required: [assigneeUserId]

ExceptionNoteRequest:
  type: object
  properties:
    note: { type: string }

ResolveExceptionRequest:
  type: object
  properties:
    resolution: { type: string, minLength: 1 }
  required: [resolution]

ReopenExceptionRequest:
  type: object
  properties:
    reason: { type: string, minLength: 1 }
  required: [reason]
