# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

/api/v1/warehouses/{warehouseId}/bins:
  parameters:
    - name: warehouseId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: A terminal whose category is WAREHOUSE.
  get:
    tags: [Warehouse]
    operationId: listBins
    summary: A warehouse's bins by code, with how full each is
    description: Requires `WAREHOUSE_READ`.
    parameters:
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
    responses:
      "200":
        description: One page of bins.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BinSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
  post:
    tags: [Warehouse]
    operationId: createBin
    summary: Add a bin to a warehouse
    description: |
      Requires `WAREHOUSE_SETUP`. Refused unless the terminal is a
      WAREHOUSE, and when the warehouse already has a bin with that code.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CreateBinRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/skus:
  get:
    tags: [Warehouse]
    operationId: listSkus
    summary: The tenant's SKUs by code
    description: Requires `WAREHOUSE_READ`.
    parameters:
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
    responses:
      "200":
        description: One page of SKUs.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkuSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
  post:
    tags: [Warehouse]
    operationId: createSku
    summary: Register a SKU
    description: Requires `WAREHOUSE_SETUP`. Codes are unique per tenant.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CreateSkuRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/asns:
  post:
    tags: [Warehouse]
    operationId: createAsn
    summary: Record an advance shipping notice
    description: Requires `WAREHOUSE_OPERATE`. Lines are numbered in the order given.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CreateAsnRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/asns/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Warehouse]
    operationId: getAsn
    summary: One ASN, with each line's count and variance
    description: Requires `WAREHOUSE_READ`.
    responses:
      "200":
        description: The ASN.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Asn" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/asns/{id}/receipt:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Warehouse]
    operationId: receiveAsn
    summary: Count the delivery in at the dock
    description: |
      Requires `WAREHOUSE_OPERATE`. Once per ASN. Undamaged units become
      stock on the dock -- or, with `crossDock`, go straight into a new
      outbound handling unit. Short, excess and damaged quantities are
      recorded per line and published as variances.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReceiveAsnRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/putaways:
  post:
    tags: [Warehouse]
    operationId: putaway
    summary: Move received stock from the dock into a bin
    description: |
      Requires `WAREHOUSE_OPERATE`. Refused with `bin-over-capacity` when
      the bin has no room, and `dock-stock-insufficient` when the dock does
      not hold that much of the SKU and lot.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PutawayRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/stock:
  get:
    tags: [Warehouse]
    operationId: listStock
    summary: What a warehouse holds, by location, SKU and lot
    description: Requires `WAREHOUSE_READ`. Empty balances are left out.
    parameters:
      - name: warehouseId
        in: query
        required: true
        schema: { type: string, format: uuid }
      - name: skuId
        in: query
        required: false
        schema: { type: string, format: uuid }
      - name: binId
        in: query
        required: false
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
    responses:
      "200":
        description: One page of balances.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockBalanceSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/stock/movements:
  get:
    tags: [Warehouse]
    operationId: listStockMovements
    summary: A SKU's ledger, newest first
    description: Requires `WAREHOUSE_READ`.
    parameters:
      - name: skuId
        in: query
        required: true
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
    responses:
      "200":
        description: One page of movements.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockMovementSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/stock/adjustments:
  post:
    tags: [Warehouse]
    operationId: adjustStock
    summary: Correct a bin's stock after a count
    description: |
      Requires `INVENTORY_ADJUST`. Recorded as a new ADJUST movement -- the
      ledger is never edited. Refused with `stock-cannot-go-negative` when a
      loss exceeds what the bin holds. Answers with the movement's id.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdjustStockRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/outbound-orders:
