    description: Requires `WAREHOUSE_OPERATE`.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CreateOutboundOrderRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/outbound-orders/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Warehouse]
    operationId: getOutboundOrder
    summary: One outbound order, with what was picked per line
    description: Requires `WAREHOUSE_READ`.
    responses:
      "200":
        description: The order.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutboundOrder" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/outbound-orders/{id}/pick:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Warehouse]
    operationId: pickOutboundOrder
    summary: Pick every line from the bins
    description: |
      Requires `WAREHOUSE_OPERATE`. Once per order. Takes what the bins hold
      and no more: a line that cannot be filled is picked short, the order
      becomes SHORT_PICKED and the shortfall is published.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/outbound-orders/{id}/pack:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Warehouse]
    operationId: packOutboundOrder
    summary: Pack everything picked into one new handling unit
    description: Requires `WAREHOUSE_OPERATE`. Answers with the handling unit's id.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/handling-units/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Warehouse]
    operationId: getHandlingUnit
    summary: One handling unit and what is in it
    description: Requires `WAREHOUSE_READ`.
    responses:
      "200":
        description: The handling unit.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HandlingUnit" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/handling-units/{id}/dispatch:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Warehouse]
    operationId: dispatchHandlingUnit
    summary: Hand a packed unit over to transport
    description: |
      Requires `WAREHOUSE_OPERATE`. Once per unit. Its contents leave the
      ledger, and the hand-off is published with them. When the request
      names a destination, consignee and gross weight, planning turns the
      unit into one full-truckload consignment, listed among the
      consignments not yet on a load; a redelivered hand-off does not
      duplicate it.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DispatchRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }
