# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

Ping:
  type: object
  properties:
    vehicleId: { type: string, format: uuid }
    recordedAt:
      type: string
      format: date-time
      description: When the *device* recorded it. Arrival order is not
        position order, and treating it as such produces a track that jumps
        backwards through time.
    lat: { type: number }
    lon: { type: number }
    speedKph: { type: number }
    headingDeg: { type: number }
    accuracyM: { type: number }
    ignitionOn: { type: boolean }
    source: { type: string }
    temperatureC:
      type: number
      description: Cargo temperature of a refrigerated vehicle, in degrees
        Celsius. Optional. Outside -60 to 100 the point is rejected as an
        implausible probe reading. On a trip, it feeds the temperature
        excursion detector.
  required: [vehicleId, recordedAt, lat, lon]

PingBatchRequest:
  type: object
  properties:
    pings:
      type: array
      minItems: 1
      maxItems: 500
      items: { $ref: "#/components/schemas/Ping" }
  required: [pings]

IngestResult:
  type: object
  description: |
    Never a 4xx for a bad point. A device reporting one implausible
    coordinate must not lose the twenty-nine good ones in the same flush,
    and it could not fix the bad one if it were told.
  properties:
    accepted: { type: integer }
    rejected: { type: integer }
    rejections:
      type: array
      items:
        type: object
        properties:
          vehicleId: { type: string, format: uuid }
          recordedAt: { type: string, format: date-time }
          reason: { type: string }

VehiclePosition:
  type: object
  properties:
    vehicleId: { type: string, format: uuid }
    registrationNo: { type: string }
    tripId: { type: string, format: uuid }
    tripNo: { type: string }
    tripStatus: { type: string }
    lat: { type: number }
    lon: { type: number }
    speedKph: { type: number }
    headingDeg: { type: number }
    ignitionOn: { type: boolean }
    recordedAt: { type: string, format: date-time }
    ageSeconds:
      type: integer
      format: int64
      description: Seconds since the fix, so a stale position is not read as current.

GeofenceCrossing:
  type: object
  properties:
    id: { type: string, format: uuid }
    eventType: { type: string, enum: [ENTERED, EXITED] }
    terminalCode: { type: string }
    occurredAt: { type: string, format: date-time }
    lat: { type: number }
    lon: { type: number }

TripProgress:
  type: object
  properties:
    tripId: { type: string, format: uuid }
    tripNo: { type: string }
    status: { type: string }
    lat: { type: number }
    lon: { type: number }
    lastFixAt: { type: string, format: date-time }
    remainingDistanceM: { type: number }
    estimatedMinutesRemaining:
      type: integer
      description: Straight-line estimate at an assumed average speed.
    completionPct: { type: number }
    offRoute: { type: boolean }
    deviationM: { type: number }

Deviation:
  type: object
  properties:
    id: { type: string, format: uuid }
    tripId: { type: string, format: uuid }
    tripNo: { type: string }
    detectedAt: { type: string, format: date-time }
    distanceM: { type: number }
    corridorM: { type: number }
    lat: { type: number }
    lon: { type: number }
    reference:
      type: string
      enum: [STRAIGHT_LINE, CORRIDOR]
      description: What the distance was measured against -- the straight line
        between the trip's terminals, or the corridor imported for its lane.


RouteCorridorRequest:
  type: object
  description: |
    The road a lane is expected to take. A lane is an origin and a destination
    terminal, which is what a trip has; importing for a lane that has a corridor
    replaces it.
  properties:
    originTerminalId: { type: string, format: uuid }
    destinationTerminalId: { type: string, format: uuid }
    name: { type: string, maxLength: 120 }
    points:
      type: array
      minItems: 2
      maxItems: 5000
      description: "`[lon, lat]` pairs in the order travelled (GeoJSON order)."
      items:
        type: array
        minItems: 2
        maxItems: 2
        items: { type: number }
    widthMetres:
      type: number
      description: How far off the polyline a vehicle may be. Omit to use the
        trip's `telematics.routeDeviation.corridorMetres`.
  required: [originTerminalId, destinationTerminalId, name, points]

RouteCorridor:
  type: object
  properties:
    id: { type: string, format: uuid }
    originTerminalId: { type: string, format: uuid }
    originTerminalCode: { type: string }
    destinationTerminalId: { type: string, format: uuid }
    destinationTerminalCode: { type: string }
    name: { type: string }
    pointCount: { type: integer }
    widthMetres: { type: number }
    points:
      type: array
      description: "`[lon, lat]` pairs. Present on a single read, absent from the list."
      items:
        type: array
        items: { type: number }
    version: { type: integer, format: int64 }
    updatedAt: { type: string, format: date-time }

RouteCorridorSlice:
  type: object
  properties:
    items:
      type: array
      items: { $ref: "#/components/schemas/RouteCorridor" }
    nextCursor: { type: string }
    hasMore: { type: boolean }
  required: [items, hasMore]
