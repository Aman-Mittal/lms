# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

Ping:
  type: object
  properties:
    vehicleId: { type: string, format: uuid }
    recordedAt:
      type: string
      format: date-time
      description: When the *device* recorded it. Arrival order is not
        position order, and treating it as such produces a track that jumps
        backwards through time.
    lat: { type: number }
    lon: { type: number }
    speedKph: { type: number }
    headingDeg: { type: number }
    accuracyM: { type: number }
    ignitionOn: { type: boolean }
    source: { type: string }
    temperatureC:
      type: number
      description: Cargo temperature of a refrigerated vehicle, in degrees
        Celsius. Optional. Outside -60 to 100 the point is rejected as an
        implausible probe reading. On a trip, it feeds the temperature
        excursion detector.
  required: [vehicleId, recordedAt, lat, lon]

PingBatchRequest:
  type: object
  properties:
    pings:
      type: array
      minItems: 1
      maxItems: 500
      items: { $ref: "#/components/schemas/Ping" }
  required: [pings]

IngestResult:
  type: object
  description: |
    Never a 4xx for a bad point. A device reporting one implausible
    coordinate must not lose the twenty-nine good ones in the same flush,
    and it could not fix the bad one if it were told.
  properties:
    accepted: { type: integer }
    rejected: { type: integer }
    rejections:
      type: array
      items:
        type: object
        properties:
          vehicleId: { type: string, format: uuid }
          recordedAt: { type: string, format: date-time }
          reason: { type: string }

VehiclePosition:
  type: object
  properties:
    vehicleId: { type: string, format: uuid }
    registrationNo: { type: string }
    tripId: { type: string, format: uuid }
    tripNo: { type: string }
    tripStatus: { type: string }
    lat: { type: number }
    lon: { type: number }
    speedKph: { type: number }
    headingDeg: { type: number }
    ignitionOn: { type: boolean }
    recordedAt: { type: string, format: date-time }
    ageSeconds:
      type: integer
      format: int64
      description: Seconds since the fix, so a stale position is not read as current.

GeofenceCrossing:
  type: object
  properties:
    id: { type: string, format: uuid }
    eventType: { type: string, enum: [ENTERED, EXITED] }
    terminalCode: { type: string }
    occurredAt: { type: string, format: date-time }
    lat: { type: number }
    lon: { type: number }

TripProgress:
  type: object
  properties:
    tripId: { type: string, format: uuid }
    tripNo: { type: string }
    status: { type: string }
    lat: { type: number }
    lon: { type: number }
    lastFixAt: { type: string, format: date-time }
    remainingDistanceM: { type: number }
    estimatedMinutesRemaining:
      type: integer
      description: Straight-line estimate at an assumed average speed.
    completionPct: { type: number }
    offRoute: { type: boolean }
    deviationM: { type: number }

Deviation:
  type: object
  properties:
    id: { type: string, format: uuid }
    tripId: { type: string, format: uuid }
    tripNo: { type: string }
    detectedAt: { type: string, format: date-time }
    distanceM: { type: number }
    corridorM: { type: number }
    lat: { type: number }
    lon: { type: number }

