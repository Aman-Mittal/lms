IssueTrackingLinkRequest:
  type: object
  properties:
    expiresInDays:
      type: integer
      minimum: 1
      maximum: 180
      description: How long the link works. 30 if omitted.

TrackingLinkIssued:
  type: object
  properties:
    id: { type: string, format: uuid }
    token:
      type: string
      description: The secret in the link. Shown here once and never again.
    expiresAt: { type: string, format: date-time }
  required: [id, token, expiresAt]

TrackingLink:
  type: object
  properties:
    id: { type: string, format: uuid }
    createdAt: { type: string, format: date-time }
    expiresAt: { type: string, format: date-time }
    revokedAt: { type: string, format: date-time }
    status: { type: string, enum: [ACTIVE, EXPIRED, REVOKED] }

TrackingLinkList:
  type: object
  properties:
    items:
      type: array
      items: { $ref: "#/components/schemas/TrackingLink" }
  required: [items]

PublicTracking:
  type: object
  description: What anyone holding a tracking link may see.
  properties:
    reference: { type: string, description: The consignment's own reference number. }
    status: { type: string, enum: [PLANNED, IN_TRANSIT, DELIVERED, CANCELLED] }
    originName: { type: string }
    destinationName: { type: string }
    requestedDeliveryAt: { type: string, format: date-time }
    deliveredAt: { type: string, format: date-time }
    proofRecorded:
      type: boolean
      description: Whether the recipient has confirmed the delivery.
    position:
      $ref: "#/components/schemas/PublicTrackingPosition"
  required: [reference, status, proofRecorded]

PublicTrackingPosition:
  type: object
  description: The last reported position of the carrying trip, to two decimals.
  properties:
    lat: { type: number }
    lon: { type: number }
    recordedAt: { type: string, format: date-time }
