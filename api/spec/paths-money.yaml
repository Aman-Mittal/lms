      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
    responses:
      "200":
        description: One page.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VendorPaymentSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/freight-bills/{id}/settlement:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the freight bill.
  get:
    tags: [Vendor payables]
    operationId: getBillSettlement
    summary: What a freight bill is approved at, the advances against it and what is payable
    description: |
      Requires `PAYABLES_MANAGE` or `INVOICE_READ`. Derived on read: the approved
      amount (the vendor's claim the bill was approved against, else the computed
      amount) split into freight and manual charges, the advances paid against
      the bill's trip, and the net payable after them. A bill that is not
      approved yet shows its computed amount.
    responses:
      "200":
        description: The settlement.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillSettlement" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/vendor-advances:
  get:
    tags: [Vendor advances]
    operationId: listVendorAdvances
    summary: Vendor advances, newest first
    description: |
      Requires `ADVANCE_REQUEST`, `ADVANCE_APPROVE`, `PAYABLES_MANAGE` or
      `INVOICE_READ`. Keyset-paged on creation time and id; `tripId` lists a trip's.
      A vendor-bound caller sees only that vendor's advances.
    parameters:
      - $ref: "#/components/parameters/status"
      - name: tripId
        in: query
        required: false
        schema: { type: string, format: uuid }
      - name: vendorId
        in: query
        required: false
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
    responses:
      "200":
        description: One page.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VendorAdvanceSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
  post:
    tags: [Vendor advances]
    operationId: requestVendorAdvance
    summary: Request an advance for a vendor against a trip
    description: |
      Requires `ADVANCE_REQUEST`. The trip must have a vendor and not be
      cancelled. All live advances on a trip together stay within
      `finance.advance.maxPercentOfFreight` of its freight, resolved for the
      trip's unit and vendor (`advance-exceeds-cap`); the freight is the trip's
      freight bill, else the platform's price of the load on the rate card in
      force, and a trip with neither is `advance-freight-unknown`. One advance
      per mode per trip while it is alive (`advance-mode-already-used`).

      Where the `VENDOR_ADVANCE` approval policy asks (it does by default) the
      answer is 202 with the advance and the approval request, advance
      `PENDING_APPROVAL`; otherwise 201 and the advance is `APPROVED`. Audited
      (`VENDOR_ADVANCE_REQUESTED`).
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RequestVendorAdvanceRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "202":
        description: Approval is required; the advance waits and the request is raised.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PendingMoneyRequest" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/vendor-advances/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the advance.
  get:
    tags: [Vendor advances]
    operationId: getVendorAdvance
    summary: One advance
    description: The `ETag` is the version `.../payment` and `.../cancellation` send back in `If-Match`.
    responses:
      "200":
        description: The advance.
        headers:
          ETag:
            schema: { type: string }
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VendorAdvance" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/vendor-advances/{id}/payment:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the advance.
  post:
    tags: [Vendor advances]
    operationId: payVendorAdvance
    summary: Record that an approved advance was paid
    description: |
      Requires `PAYABLES_MANAGE`. The advance must be `APPROVED`
      (`advance-illegal-transition` otherwise). It becomes `PAID` with its
      reference and day, and is deducted when the vendor's invoice for the trip
      is captured. Audited (`VENDOR_ADVANCE_PAID`) and announced as
      `VENDOR_ADVANCE_PAID`.
    parameters:
      - $ref: "#/components/parameters/ifMatch"
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PayVendorAdvanceRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/vendor-advances/{id}/cancellation:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the advance.
  post:
    tags: [Vendor advances]
    operationId: cancelVendorAdvance
    summary: Cancel an advance that has not been paid
    description: |
      Requires `ADVANCE_REQUEST`; a reason is mandatory. A pending advance is
      cancelled by withdrawing its approval request. Once paid it is
      `advance-already-paid`: the money has left. The mode is given back.
      Audited (`VENDOR_ADVANCE_CANCELLED`).
    parameters:
      - $ref: "#/components/parameters/ifMatch"
      - $ref: "#/components/parameters/idempotencyKey"
