# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

/api/v1/vehicles:
  get:
    tags: [Vehicles]
    operationId: listVehicles
    summary: A page of vehicles
    parameters:
      - $ref: "#/components/parameters/status"
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/q"
    responses:
      "200":
        description: One page of vehicles.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
  post:
    tags: [Vehicles]
    operationId: registerVehicle
    summary: Register a vehicle
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RegisterVehicleRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/vehicles/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Vehicles]
    operationId: getVehicle
    summary: One vehicle
    responses:
      "200":
        description: The vehicle.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Vehicle" }
        headers:
          ETag:
            description: The vehicle's version; send it back as `If-Match` when editing.
            schema: { type: string }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
  put:
    tags: [Vehicles]
    operationId: updateVehicle
    summary: Change a vehicle's owner, type, capacities and flags
    description: |
      The registration number never changes. A stale `If-Match` is refused
      with 409 `concurrent-modification`.
    parameters:
      - $ref: "#/components/parameters/ifMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UpdateVehicleRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/vehicles/{id}/deactivate:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Vehicles]
    operationId: deactivateVehicle
    summary: Switch a vehicle off, with a reason
    description: |
      There is no delete. An inactive vehicle is refused at trip assignment,
      load planning and dispatch with 409 `vehicle-inactive`. Refused with 409
      `vehicle-on-trip` while it is on a trip and `vehicle-already-inactive`
      if it is already off.
    parameters:
      - $ref: "#/components/parameters/ifMatchOptional"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReasonRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/vehicles/{id}/reactivate:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Vehicles]
    operationId: reactivateVehicle
    summary: Switch an inactive vehicle back on, with a reason
    description: Refused with 409 `vehicle-not-inactive` when it is not inactive.
    parameters:
      - $ref: "#/components/parameters/ifMatchOptional"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReasonRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/vehicles/{id}/documents:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Vehicles]
    operationId: listVehicleDocuments
    summary: Statutory documents for a vehicle
    responses:
      "200":
        description: Documents, soonest expiry first.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/ComplianceDocument" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
  post:
    tags: [Vehicles]
    operationId: attachVehicleDocument
    summary: File a statutory document against a vehicle
    description: |
      An expired document here is a hard stop at dispatch, not a warning.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AttachDocumentRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }
