# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

User:
  type: object
  properties:
    id: { type: string, format: uuid }
    email: { type: string, format: email }
    fullName: { type: string }
    status: { type: string, enum: [ACTIVE, SUSPENDED, LOCKED] }
    orgPath: { type: string }
    orgUnitId: { type: string, format: uuid }
    orgName: { type: string }
    lastLoginAt: { type: string, format: date-time }
    version: { type: integer, format: int64, description: The version an edit sends as `If-Match`. }
    roles:
      type: array
      items: { type: string }
      description: The codes of the roles the user holds.

CreateUserRequest:
  type: object
  properties:
    orgUnitId: { type: string, format: uuid, description: The unit to file the user under; the caller's own when absent. }
    email: { type: string, format: email, description: The login id the user signs in with. }
    password: { type: string, format: password, description: Typed by the administrator; must satisfy the password policy. }
    fullName: { type: string }
    roles:
      type: array
      items: { type: string }
      description: Role codes to grant.
  required: [email, password, fullName]

UpdateUserRequest:
  type: object
  properties:
    fullName: { type: string }
    roles:
      type: array
      items: { type: string }
      description: The complete set of role codes the user should hold.
  required: [fullName]

SetPasswordRequest:
  type: object
  properties:
    password: { type: string, format: password }
  required: [password]

Me:
  type: object
  description: The signed-in caller.
  properties:
    userId: { type: string, format: uuid }
    email: { type: string }
    fullName: { type: string }
    tenantId: { type: string, format: uuid }
    tenantCode: { type: string }
    tenantName: { type: string }
    orgUnitId: { type: string, format: uuid }
    orgPath: { type: string }
    orgUnitName: { type: string }
    roles:
      type: array
      items: { type: string }
      description: The codes of the roles the user holds.
    permissions:
      type: array
      items: { type: string }
      description: What this session's token allows.
    cacheEpoch:
      type: string
      description: |
        Changes when the caller's tenant, unit, roles or permissions change,
        and otherwise stays the same. A console that keeps data in the browser
        discards it when the value differs from the one it stored.
  required: [tenantId, roles, permissions]
