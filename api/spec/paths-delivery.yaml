/api/v1/deliveries/{consignmentId}/otp:
  parameters:
    - name: consignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the consignment.
  post:
    tags: [Delivery and claims]
    operationId: issueDeliveryOtp
    summary: Issue a one-time code for a delivery
    description: |
      Requires `POD_RECORD`. The consignment must have left: in transit or
      delivered, or on a load whose trip has been dispatched (a full-truckload
      consignment's own status does not advance, so the trip decides).
      The code is kept only as a hash, expires (15 minutes by default) and
      allows three wrong attempts; issuing again replaces it and resets the
      count. Real delivery of the code is a notification, which is deferred:
      the code is returned here **only** where the deployment exposes it (a
      demo), and is otherwise absent from the response.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    responses:
      "200":
        description: The code was issued.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpIssued" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/deliveries/{consignmentId}/proof:
  parameters:
    - name: consignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the consignment.
  post:
    tags: [Delivery and claims]
    operationId: recordDeliveryProof
    summary: Record the proof of delivery
    description: |
      Requires `POD_RECORD`. Succeeds when the code matches. A wrong, expired,
      exhausted or never-issued code is refused with the same answer
      (`code: otp-invalid`), so a caller cannot tell which; a wrong code counts
      against the three attempts. One proof per consignment.

      A full truckload can be proved once its trip has left; a part-load
      docket only once it is out for delivery from its destination hub
      (`consignment-not-in-transit` otherwise). A confirmed proof moves the
      consignment to DELIVERED if its trip has not already done so, and
      decides money: the carrier's trip settles only once every consignment
      on it is proved CLEAN, and a client's transport is invoiced once each of
      its consignments has a confirmed proof. A SHORTAGE or DAMAGE needs a
      `remark` (`proof-remark-required`).
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RecordDeliveryProofRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/deliveries/{consignmentId}/pod:
  parameters:
    - name: consignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the consignment.
  post:
    tags: [Delivery and claims]
    operationId: ensureProofOfDelivery
    summary: Start a consignment's draft proof of delivery
    description: |
      Requires `POD_RECORD`. Creates the draft (status `PENDING`) the proof is fed
      into over time, or finds the one already there: asking again changes nothing.
      The consignment must have left, as for a code (`consignment-not-in-transit`).
      Read the draft with `GET /deliveries/{consignmentId}`.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/deliveries/{consignmentId}/pod/lines:
  parameters:
    - name: consignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the consignment.
  put:
    tags: [Delivery and claims]
    operationId: feedProofLines
    summary: Replace what was received against the order lines
    description: |
      Requires `POD_RECORD`. Each entry names an order line of the consignment and
      its received, short, damaged and excess quantities (omitted is zero). Replaces
      every line fed so far; an empty list clears them. Refused with 409 once the
      proof proves the delivery (`proof-already-recorded`), with 400 and
      `pod-line-unknown`, `pod-line-duplicate` or `pod-quantity-invalid`.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FeedProofLinesRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/deliveries/{consignmentId}/pod/documents:
  parameters:
    - name: consignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the consignment.
  put:
    tags: [Delivery and claims]
    operationId: setProofDocuments
    summary: Replace the documents listed for the proof
    description: |
      Requires `POD_RECORD`. A type (`FRONT`, `BACK` or `OTHER`) and a reference
      each, at most 20; the platform stores no file. Replaces the list.
      A 400 refuses a malformed list; `pod-document-invalid` and `pod-documents-too-many` a bad one.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SetProofDocumentsRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/deliveries/{consignmentId}/pod/timings:
  parameters:
    - name: consignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the consignment.
  put:
    tags: [Delivery and claims]
    operationId: setProofTimings
    summary: Set the reporting and unloading times
    description: |
      Requires `POD_RECORD`. Whatever is given must run in order -- reporting, then
      unloading start, then unloading end, none after now -- or the answer is 400
      with `pod-timing-order-invalid` or `pod-timing-in-future`. A time omitted is
      cleared.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SetProofTimingsRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/deliveries/{consignmentId}/pod/submit:
  parameters:
    - name: consignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the consignment.
  post:
    tags: [Delivery and claims]
    operationId: submitProofOfDelivery
    summary: Submit the fed draft with the consignee's code
    description: |
      Requires `POD_RECORD`. Same code rules as `POST .../proof` (`otp-invalid`), and
      the same effects: DELIVERED, the settlement hold lifted once every proof is
      clean, the client billable. Before that the proof must meet its policy
      (settings `delivery.pod.*`): lines fed when `feedingRequired`
      (`pod-lines-required`); the quantity that arrived (received, damaged and
      excess) within `quantityTolerancePercent` of the gross
      (`pod-quantity-outside-tolerance`); a front and a back document when asked
      (`pod-front-document-required`, `pod-back-document-required`). The condition
      is the worse of the one given and the one the lines show; anything but CLEAN
      needs a remark. Status becomes `SUBMITTED`.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SubmitProofRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/deliveries/{consignmentId}/pod/paper:
  parameters:
    - name: consignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the consignment.
  post:
    tags: [Delivery and claims]
    operationId: keyPaperProof
    summary: Key the proof from the signed paper copy
    description: |
      Requires `POD_PAPER_KEY`, its own right. No code: staff key the proof from
      paper. Same checks and effects as submit; the proof is marked `paper` and
      carries `keyedBy`, and the audit trail records `DELIVERY_POD_PAPER_KEYED`.
      No draft need be started first.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/KeyPaperProofRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/deliveries/{consignmentId}/pod/not-received:
  parameters:
    - name: consignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the consignment.
  post:
    tags: [Delivery and claims]
    operationId: markProofNotReceived
    summary: Record that the consignee took nothing
    description: |
      Requires `POD_RECORD`. Status becomes `NOT_RECEIVED` and the consignment is not
      delivered; the draft may still be fed and submitted. A remark is required.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NotReceivedRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/deliveries/{consignmentId}/proof/reversal:
  parameters:
    - name: consignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the consignment.
  post:
    tags: [Delivery and claims]
    operationId: requestProofReversal
    summary: Ask for a confirmed proof of delivery to be reversed
    description: |
      Requires `POD_REVERSE`. Applies to a CONFIRMED or SUBMITTED proof. Always goes through an approval: the answer is
      202 with the request (subject type `POD_REVERSAL`), decided by a holder
      of `POD_REVERSAL_APPROVE` other than the requester. Approving it marks
      the proof REVERSED, puts the consignment back in transit (out for
      delivery for a docket) unless a completed trip delivered it, holds again
      a completed trip's settlement the proof had released, and audits
      `DELIVERY_PROOF_REVERSED`.

      Refused with 409 and a code: `proof-not-recorded` without a confirmed
      proof; `pod-already-billed` once the carrier's bill for a trip that
      carried it was approved for payment or the client's transport charge
      for it was invoiced -- checked again when the request is approved, and
      a refusal then leaves the request open; `approval-already-open` while a
      reversal request is open. Another tenant's consignment is 404.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProofReversalRequest" }
    responses:
      "202":
        description: The approval request raised.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalTicket" }
      "204": { $ref: "#/components/responses/NoContent" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/deliveries/{consignmentId}:
  parameters:
    - name: consignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the consignment.
  get:
    tags: [Delivery and claims]
    operationId: getDeliveryProof
    summary: A consignment's proof of delivery
    description: |
      Requires `POD_READ`. 404 until a code has been issued or a draft started. Carries every order line of
      the consignment with what was fed to it, the documents listed and the unloading times.
    responses:
      "200":
        description: The proof, or the fact that a code is waiting to be matched.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryProof" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }

/api/v1/claims:
  get:
    tags: [Delivery and claims]
    operationId: listClaims
    summary: A page of claims
    description: Requires `CLAIM_READ`. Ordered by claim number.
    parameters:
      - name: status
        in: query
        schema: { $ref: "#/components/schemas/ClaimStatus" }
      - name: consignmentId
        in: query
        schema: { type: string, format: uuid }
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
    responses:
      "200":
        description: One page of claims.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
  post:
    tags: [Delivery and claims]
    operationId: raiseClaim
    summary: Raise a claim against a consignment
    description: |
      Requires `CLAIM_RAISE`. DAMAGE and SHORTAGE need a confirmed proof of
      delivery (`code: claim-needs-proof-of-delivery`); LOSS and DELAY do not.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RaiseClaimRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/claims/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the claim.
  get:
    tags: [Delivery and claims]
    operationId: getClaim
    summary: One claim
    description: Requires `CLAIM_READ`.
    responses:
      "200":
        description: The claim.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Claim" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }

/api/v1/claims/{id}/transitions:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the claim.
  post:
    tags: [Delivery and claims]
    operationId: transitionClaim
    summary: Move a claim along its lifecycle
    description: |
      Requires `CLAIM_DECIDE`. OPEN to UNDER_REVIEW; UNDER_REVIEW to APPROVED
      or REJECTED; APPROVED to SETTLED. Approval states an approved amount
      above zero and not above the claim; rejection needs a reason.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TransitionClaimRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }
