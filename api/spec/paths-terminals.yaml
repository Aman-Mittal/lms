# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

/api/v1/terminals:
  get:
    tags: [Terminals]
    operationId: listTerminals
    summary: A page of terminals
    description: |
      Carries an `ETag` over the page's terminals and their versions. A caller
      that sends it back in `If-None-Match` gets `304 Not Modified` with no body
      while none has changed, which is how a console revalidates cached
      geometry.
    parameters:
      - name: category
        in: query
        schema: { type: string, enum: [PLANT, WAREHOUSE, PORT, HUB, TOLL_PLAZA, CUSTOMER_SITE, RAILHEAD] }
      - name: status
        in: query
        description: One status, or `ALL`. Without it the list is the active terminals.
        schema: { type: string, enum: [ACTIVE, INACTIVE, ALL] }
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/q"
    responses:
      "200":
        description: One page of terminals.
        headers:
          ETag:
            description: A digest of the page's terminals and their versions.
            schema: { type: string }
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminalSlice" }
      "304":
        description: The page is as the caller's `If-None-Match` says.
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/terminals/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Terminals]
    operationId: getTerminal
    summary: One terminal
    description: |
      Its version is the `ETag`; `If-None-Match` with it answers `304 Not
      Modified` while the terminal (and so its geofence) is unchanged.
    responses:
      "200":
        description: The terminal.
        headers:
          ETag:
            description: The terminal's version.
            schema: { type: string }
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Terminal" }
      "304":
        description: Unchanged since the caller's `If-None-Match`.
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
  put:
    tags: [Terminals]
    operationId: updateTerminal
    summary: Change a terminal's name, geofence, docks, hours or dwell
    description: |
      The code never changes. A new geofence is refused with 409
      `terminal-overlap` if it overlaps another terminal of the same category
      (the terminal's own old footprint does not count). Send the `version`
      last read, in the body or as `If-Match` (the header wins): a stale one is
      refused with 409 `concurrent-modification`. Omitting
      `permittedVehicleTypes` keeps the present list.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UpdateTerminalRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }
  delete:
    tags: [Terminals]
    operationId: deleteTerminal
    summary: Switch a terminal off (deprecated spelling of deactivate)
    deprecated: true
    description: |
      Kept for existing clients and now a soft deactivate: nothing is deleted.
      The optional `reason` goes to the audit trail. Use `POST
      /terminals/{id}/deactivate`.
    parameters:
      - name: reason
        in: query
        required: false
        schema: { type: string }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/terminals/{id}/deactivate:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Terminals]
    operationId: deactivateTerminal
    summary: Switch a terminal off, with a reason
    description: |
      Nothing is deleted. Refused with 409 `terminal-in-use` while an open
      order, load or trip names the terminal, and `terminal-already-inactive`
      if it is already off.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReasonRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/terminals/{id}/reactivate:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Terminals]
    operationId: reactivateTerminal
    summary: Switch an inactive terminal back on, with a reason
    description: |
      Refused with 409 `terminal-overlap` if its ground has been taken by an
      active terminal of the same category meanwhile, and
      `terminal-not-inactive` if it is not inactive.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReasonRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/terminals/polygon:
  post:
    tags: [Terminals]
    operationId: registerPolygonTerminal
    summary: Register a terminal with a polygon geofence
    description: |
      Refused with 409 if the ring overlaps an existing terminal of the same
      functional category, and with 400 if the ring is self-intersecting --
      point-in-polygon is genuinely ambiguous for a bow-tie, so the honest
      answer is to refuse rather than pick a lobe.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RegisterPolygonTerminalRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/terminals/point-radius:
  post:
    tags: [Terminals]
    operationId: registerPointRadiusTerminal
    summary: Register a terminal with a point-radius geofence
    description: |
      Two endpoints rather than one with a discriminator: a polygon with a
      radius, or a centre with no point, should not be expressible.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RegisterPointRadiusTerminalRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }
