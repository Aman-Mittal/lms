# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

/api/v1/ltl/zones/{terminalId}:
  parameters:
    - name: terminalId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: The terminal being zoned -- a hub, or a delivery point.
  put:
    tags: [LTL rating]
    operationId: assignLtlZone
    summary: Place a terminal in a rating zone
    description: |
      Replaces any earlier placement. Applies to the next docket priced; a
      receivable already raised keeps the zones it was priced with.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AssignLtlZoneRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/ltl/rate-cards:
  post:
    tags: [LTL rating]
    operationId: publishLtlRateCard
    summary: Publish a zone-to-zone rate card version
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PublishLtlRateCardRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/ltl/receivables:
  get:
    tags: [LTL rating]
    operationId: listDocketReceivables
    summary: A page of docket receivables
    description: |
      Keyed on the docket number. Narrow to one customer for a statement.
      There is no endpoint to create one: a receivable is raised when an LTL
      docket is booked.
    parameters:
      - name: customerPartnerId
        in: query
        required: false
        schema: { type: string, format: uuid }
        description: Restricts the listing to one customer's dockets.
      - $ref: "#/components/parameters/status"
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
    responses:
      "200":
        description: One page of receivables.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocketReceivableSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
