# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

/api/v1/freight-bills:
  get:
    tags: [Settlement]
    operationId: listFreightBills
    summary: A page of freight bills
    parameters:
      - $ref: "#/components/parameters/status"
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/q"
    responses:
      "200":
        description: One page of bills.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreightBillSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/freight-bills/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Settlement]
    operationId: getFreightBill
    summary: One bill
    description: |
      There is no endpoint to create one. A bill is raised when a trip
      completes, because pricing depends on the dispatch date and the origin
      dwell -- facts the movement produces, not facts a caller supplies.
      A milk-run circuit's bill is raised when the circuit reaches its
      plant, and supersedes (cancels) an unsettled bill for the trip that
      carried it, so one movement is never payable twice.
    responses:
      "200":
        description: The bill.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreightBill" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/freight-bills/{id}/lines:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Settlement]
    operationId: getFreightBillLines
    summary: The arithmetic behind the total
    description: |
      A bill carrying only a total is unarguable. These lines are the entire
      content of the conversation that follows a dispute.
    responses:
      "200":
        description: Lines in order.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/FreightBillLine" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/freight-bills/{id}/match:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Settlement]
    operationId: matchFreightBill
    summary: Record the vendor's invoice and settle it
    description: |
      Approved when the difference is within the greater of a percentage and
      an absolute floor; disputed otherwise. An underclaim beyond tolerance is
      disputed too -- it means the two sides' understanding of the rate has
      diverged, and next month it points the other way. Both are the settings
      `finance.match.tolerancePercent` and `finance.match.toleranceAbsolute`,
      resolved for the bill's unit and vendor.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MatchRequest" }
    responses:
      "200":
        description: What the comparison settled to.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchResponse" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/freight-bills/{id}/resolve:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Settlement]
    operationId: resolveDispute
    summary: Settle a dispute in the vendor's favour, on the record
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ResolveDisputeRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/freight-bills/{id}/proof-hold/release:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Settlement]
    operationId: releaseProofHold
    summary: Release a bill's trip from waiting on proofs of delivery
    description: |
      Requires `SETTLEMENT_HOLD_RELEASE`. For a proof that recorded a
      shortage or damage somebody has accepted, or a proof that will never
      come. The reason is audited (`SETTLEMENT_PROOF_HOLD_RELEASED`). An
      exception ticket holding the same trip is not touched. 409
      `no-proof-hold` when the trip is not held for proofs, and
      `release-reason-required` without a reason.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReleaseProofHoldRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/tariffs:
  get:
    tags: [Settlement]
    operationId: listTariffs
    summary: Rate card versions, newest first
    description: |
      Requires `TARIFF_MANAGE` or `INVOICE_READ`. Only cards on the caller's
      line of the organisation are listed -- published under one of the
      caller's ancestors, the caller's own unit, or a unit beneath it -- and a
      vendor's own staff see only that vendor's cards.
    parameters:
      - name: vendorPartnerId
        in: query
        required: false
        schema: { type: string, format: uuid }
        description: Only this vendor's cards.
      - name: originTerminalId
        in: query
        required: false
        schema: { type: string, format: uuid }
        description: Only cards for lanes starting here.
      - name: destinationTerminalId
        in: query
        required: false
        schema: { type: string, format: uuid }
        description: Only cards for lanes ending here.
      - name: vehicleType
        in: query
        required: false
        schema: { type: string }
        description: Only cards for this vehicle type.
      - name: superseded
        in: query
        required: false
        schema: { type: boolean }
        description: True for versions a successor has closed, false for open ones; both when absent.
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
    responses:
      "200":
        description: One page of rate card versions.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TariffSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
  post:
    tags: [Settlement]
    operationId: publishTariff
    summary: Publish a rate card version
    description: |
      POST only, and that is the contract rather than an omission. A rate card
      is a version: correcting one means publishing a successor, which closes
      the incumbent. The database refuses an edit by trigger, so the API does
      not offer one.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PublishTariffRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/tariffs/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Settlement]
    operationId: getTariff
    summary: One rate card version with its weight bands
    description: |
      Requires `TARIFF_MANAGE` or `INVOICE_READ`. A card of a sibling branch of
      the organisation, or another vendor's for a vendor's own staff, is not
      found.
    responses:
      "200":
        description: The rate card version and its bands, lightest first.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TariffCard" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/tariffs/{id}/slabs:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Settlement]
    operationId: addTariffSlab
    summary: Add a weight band to an open rate card
    description: |
      Refused once the card has been superseded: adding a band to a closed
      version would change what already-priced movements cost without touching
      a single bill. Held to the card's organisational unit as publishing it
      is: 403 outside the caller's subtree.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AddSlabRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/tariffs/fuel-surcharges:
  post:
    tags: [Settlement]
    operationId: recordFuelSurcharge
    summary: Record the fuel surcharge for a month
    description: |
      A stored figure rather than a price feed. An external dependency on the
      pricing path means invoices that cannot be raised because somebody
      else's service is down. The index is the tenant's, so the write is held
      to the root of the organisation: 403 for a caller confined to a unit
      beneath it.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FuelSurchargeRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }
