# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

Driver:
  type: object
  properties:
    id: { type: string, format: uuid }
    fullName: { type: string }
    phone: { type: string }
    licenceNo: { type: string }
    licenceClass: { type: string }
    licenceExpiresOn: { type: string, format: date }
    licenceExpired: { type: boolean }
    hazmatEndorsed: { type: boolean }
    status: { type: string, enum: [AVAILABLE, ON_TRIP, REST, INACTIVE] }
    hosMinutesToday: { type: integer }
    employerPartnerId: { type: string, format: uuid }
    employerPartnerName: { type: string }
    createdAt: { type: string, format: date-time }

RegisterDriverRequest:
  type: object
  properties:
    orgUnitId: { type: string, format: uuid }
    employerPartnerId: { type: string, format: uuid }
    fullName: { type: string }
    phone: { type: string }
    licenceNo: { type: string }
    licenceClass: { type: string }
    licenceAuthority: { type: string }
    licenceExpiresOn: { type: string, format: date }
    hazmatEndorsed: { type: boolean }
  required: [orgUnitId, fullName, phone, licenceNo, licenceClass, licenceExpiresOn]

DriverSlice:
  type: object
  description: One page. No total and no page number -- both need the scan
    keyset pagination exists to avoid.
  properties:
    items:
      type: array
      items: { $ref: "#/components/schemas/Driver" }
    nextCursor:
      type: string
      description: Pass as `cursor` for the next page. Null on the last.
    hasMore: { type: boolean }
  required: [items, hasMore]
