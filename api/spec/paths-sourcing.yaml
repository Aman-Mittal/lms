/api/v1/routing-guides:
  post:
    tags: [Sourcing]
    operationId: defineRoutingGuide
    summary: Open a routing guide for a lane and vehicle type
    description: |
      Requires `ROUTING_GUIDE_MANAGE`. One guide per lane and vehicle type,
      retired ones included (`routing-guide-exists`): old allocations point at
      the guide they went out under, so a lane's vendors are changed by
      editing its entries rather than by writing a second guide.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DefineGuideRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/routing-guides/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Sourcing]
    operationId: getRoutingGuide
    summary: A guide and its vendors in rank order
    responses:
      "200":
        description: The guide.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoutingGuide" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/routing-guides/{id}/vendors:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Sourcing]
    operationId: addRoutingGuideVendor
    summary: Put a vendor on the guide at a rank
    description: |
      Requires `ROUTING_GUIDE_MANAGE`. Refused for a vendor that is not ACTIVE
      (`vendor-not-active`), a rank already held (`rank-taken`), a vendor
      already on the guide (`vendor-already-ranked`) or a retired guide.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AddVendorRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/routing-guides/{id}/retire:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Sourcing]
    operationId: retireRoutingGuide
    summary: Stop the guide being used for new allocations
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
