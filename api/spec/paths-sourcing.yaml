# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

/api/v1/allocations:
  get:
    tags: [Sourcing]
    operationId: listAllocations
    summary: A page of allocations
    parameters:
      - $ref: "#/components/parameters/status"
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
    responses:
      "200":
        description: One page of allocations.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllocationSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
  post:
    tags: [Sourcing]
    operationId: allocateLoad
    summary: Offer a load to vendors
    description: |
      Walks the routing guide in rank order. An exhausted cascade is terminal
      and needs a human: a load nobody will take is a commercial problem, and
      re-offering automatically would spin against unwilling vendors while the
      freight sits.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AllocateRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/allocations/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Sourcing]
    operationId: getAllocation
    summary: One allocation
    responses:
      "200":
        description: The allocation.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Allocation" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/allocations/{id}/offers:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Sourcing]
    operationId: listOffers
    summary: Every offer made under an allocation
    responses:
      "200":
        description: |
          Offers in rank order. An unknown id, or one that belongs to another
          tenant, is an empty list and not a 404.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/Offer" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }

