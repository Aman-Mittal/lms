    allowedLoadTypes:
      type: array
      items: { type: string }
      description: The load or vehicle types the contract covers (stored upper case); empty
        is any. Omitted is any for a new draft and unchanged for a revision.
    lanes:
      type: array
      description: |
        The version's lanes. On a revision this replaces them whole (an empty list
        removes them all) and leaving it out keeps them. Lane codes are distinct
