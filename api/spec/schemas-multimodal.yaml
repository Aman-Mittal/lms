# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

ItineraryLeg:
  type: object
  properties:
    id: { type: string, format: uuid }
    seq: { type: integer, description: Position in the itinerary; the first leg is 1. }
    mode:
      type: string
      enum: [ROAD, RAIL]
    status:
      type: string
      enum: [PLANNED, PLACED, LOADED, DEPARTED, ARRIVED, RELEASED]
      description: A road leg only ever reads PLANNED, DEPARTED or ARRIVED.
    fromTerminalId: { type: string, format: uuid }
    fromTerminalCode: { type: string }
    toTerminalId: { type: string, format: uuid }
    toTerminalCode: { type: string }
    plannedDepartureAt: { type: string, format: date-time }
    plannedArrivalAt: { type: string, format: date-time }
    transferDwellMinutes:
      type: integer
      description: Time needed at this leg's origin after the previous leg
        arrives, before this one may start.
    tripId: { type: string, format: uuid, description: ROAD legs only. }
    tripNo: { type: string }
    unitType:
      type: string
      enum: [WAGON, CONTAINER]
      description: RAIL legs only.
    unitCount: { type: integer }
    bookingRef: { type: string }
    trainNo: { type: string }
    carrierPartnerId: { type: string, format: uuid }
    carrierCode: { type: string }
    costAmount: { type: number }
    railTariffId:
      type: string
      format: uuid
      description: The rail rate card that priced this leg. Null when the
        planner gave the cost, and always for a road leg.
    railTariffCode: { type: string }
    placedAt: { type: string, format: date-time }
    loadedAt: { type: string, format: date-time }
    departedAt: { type: string, format: date-time }
    arrivedAt: { type: string, format: date-time }
    releasedAt: { type: string, format: date-time }
    startedEarly:
      type: boolean
      description: A road leg whose trip was dispatched before the hand-off
        allowed. Recorded rather than refused -- dispatch is the trip's gate.
    connectionMissedAt:
      type: string
      format: date-time
      description: When the previous leg's arrival made this leg's planned
        start impossible -- or, if it never arrived, when the periodic sweep
        found it overdue with no time left to transfer.
    earliestStartAt:
      type: string
      format: date-time
      description: The previous leg's arrival plus the transfer dwell, set
        when the connection was missed. When the sweep marked the miss with
        nothing arrived, a lower bound (detection time plus the dwell),
        revised once the previous leg arrives.

CarrierCost:
  type: object
  description: What one carrier is owed across the legs it runs.
  properties:
    carrierPartnerId: { type: string, format: uuid }
    carrierCode: { type: string }
    legCount: { type: integer }
    totalCost: { type: number }

ItinerarySummary:
  type: object
  properties:
    id: { type: string, format: uuid }
    itineraryNo: { type: string }
    shipmentRef: { type: string }
    status:
      type: string
      enum: [PLANNED, IN_PROGRESS, COMPLETED]
      description: Derived from the legs. COMPLETED once the last leg has arrived.
    currency: { type: string }
    legCount: { type: integer }
    totalCost:
      type: number
      description: Every leg's cost, summed. Each leg's carrier is still
        paid separately.
    connectionMissed: { type: boolean }
    createdAt: { type: string, format: date-time }

Itinerary:
  type: object
  properties:
    id: { type: string, format: uuid }
    itineraryNo: { type: string }
    shipmentRef: { type: string }
    status:
      type: string
      enum: [PLANNED, IN_PROGRESS, COMPLETED]
    currency: { type: string }
    legCount: { type: integer }
    totalCost: { type: number }
    connectionMissed: { type: boolean }
    createdBy: { type: string }
    createdAt: { type: string, format: date-time }
    legs:
      type: array
      items: { $ref: "#/components/schemas/ItineraryLeg" }
    costByCarrier:
      type: array
      items: { $ref: "#/components/schemas/CarrierCost" }

ItinerarySlice:
  type: object
  description: One page, newest first. No total and no page number.
  properties:
    items:
      type: array
      items: { $ref: "#/components/schemas/ItinerarySummary" }
    nextCursor:
      type: string
      description: Pass as `cursor` for the next page. Null on the last.
    hasMore: { type: boolean }
  required: [items, hasMore]

PlanItineraryLegRequest:
  type: object
  properties:
    mode:
      type: string
      enum: [ROAD, RAIL]
    fromTerminalId: { type: string, format: uuid }
    toTerminalId: { type: string, format: uuid }
    plannedDepartureAt: { type: string, format: date-time }
    plannedArrivalAt: { type: string, format: date-time }
    transferDwellMinutes: { type: integer, minimum: 0, default: 0 }
    tripId:
      type: string
      format: uuid
      description: Required for ROAD, forbidden for RAIL. The trip must not
        have been dispatched yet.
    unitType:
      type: string
      enum: [WAGON, CONTAINER]
      description: Required for RAIL.
    unitCount: { type: integer, minimum: 1, description: Required for RAIL. }
    bookingRef: { type: string, description: The railway's booking reference. Required for RAIL. }
    trainNo: { type: string }
    carrierPartnerId: { type: string, format: uuid }
    costAmount:
      type: number
      minimum: 0
      description: Required for ROAD. Optional for RAIL -- when omitted, the
        leg is priced from the carrier's rail rate card for the railhead
        pair in force on the planned departure day (UTC), and refused
        (`rail-leg-no-tariff`) when there is none. When given, it overrides
        any card.
  required: [mode, fromTerminalId, toTerminalId, plannedDepartureAt, plannedArrivalAt,
             carrierPartnerId]

PlanItineraryRequest:
  type: object
  properties:
    shipmentRef: { type: string, minLength: 1 }
    currency: { type: string, description: Optional. INR when not given. }
    legs:
      type: array
      minItems: 1
      maxItems: 10
      items: { $ref: "#/components/schemas/PlanItineraryLegRequest" }
  required: [shipmentRef, legs]

RailTariff:
  type: object
  description: One version of a rail carrier's rate card between two railheads.
  properties:
    id: { type: string, format: uuid }
    code: { type: string }
    carrierPartnerId: { type: string, format: uuid }
    carrierCode: { type: string }
    originTerminalId: { type: string, format: uuid }
    originTerminalCode: { type: string }
    destinationTerminalId: { type: string, format: uuid }
    destinationTerminalCode: { type: string }
    currency: { type: string }
    perWagonRate: { type: number, description: Null when the card does not price wagons. }
    perContainerRate: { type: number, description: Null when the card does not price containers. }
    minimumCharge: { type: number }
    effectiveFrom: { type: string, format: date }
    effectiveTo:
      type: string
      format: date
      description: Inclusive last day. Null while this is the version in force.
    createdBy: { type: string }
    createdAt: { type: string, format: date-time }

RailTariffSlice:
  type: object
  description: One page, newest first. No total and no page number.
  properties:
    items:
      type: array
      items: { $ref: "#/components/schemas/RailTariff" }
    nextCursor:
      type: string
      description: Pass as `cursor` for the next page. Null on the last.
    hasMore: { type: boolean }
  required: [items, hasMore]

PublishRailTariffRequest:
  type: object
  properties:
    code: { type: string, minLength: 1 }
    carrierPartnerId: { type: string, format: uuid }
    originTerminalId: { type: string, format: uuid, description: A RAILHEAD terminal. }
    destinationTerminalId: { type: string, format: uuid, description: A RAILHEAD terminal. }
    currency: { type: string, description: Optional. INR when not given. }
    perWagonRate:
      type: number
      minimum: 0
      description: Per wagon booked. At least one of the two rates is required.
    perContainerRate:
      type: number
      minimum: 0
      description: Per container booked. At least one of the two rates is required.
    minimumCharge: { type: number, minimum: 0, description: Optional floor for a booking. Zero when not given. }
    effectiveFrom: { type: string, format: date }
  required: [code, carrierPartnerId, originTerminalId, destinationTerminalId, effectiveFrom]

RailMilestoneRequest:
  type: object
  properties:
    milestone:
      type: string
      enum: [PLACED, LOADED, DEPARTED, ARRIVED, RELEASED]
    at:
      type: string
      format: date-time
      description: Optional. When it happened; now if not given.
  required: [milestone]
