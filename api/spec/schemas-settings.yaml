# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.


SettingScopeType:
  type: string
  enum: [PLATFORM, ORG_DEFAULT, ORG_UNIT, VEHICLE, CUSTOMER, USER]
  description: |
    Where a profile applies, in ascending precedence. PLATFORM profiles belong
    to no tenant: the platform operator's values for every tenant, globally or
    per jurisdiction. ORG_DEFAULT has no scope id; USER profiles are a
    person's own preferences.

SettingCategory:
  type: string
  enum: [OPERATIONS, UI, NOTIFICATIONS, COMPLIANCE]
  description: What a setting is about. A COMPLIANCE setting is always effective-dated.

SettingValueType:
  type: string
  enum: [BOOLEAN, INTEGER, DECIMAL, STRING, ENUM, DURATION, JSON]
  description: |
    BOOLEAN true/false; INTEGER and DECIMAL numbers within `min`..`max`
    (DECIMAL to `scale` places); STRING text up to `maxLength`, of `format`;
    ENUM one of `allowedValues`; DURATION ISO-8601 text such as `PT45M`;
    JSON a flat object of the named `jsonProperties`.

SettingStringFormat:
  type: string
  enum: [TEXT, LOCALE, TIME_ZONE]

SettingDefinition:
  type: object
  properties:
    key: { type: string, description: "Dotted, owner first: `order.close.tolerancePercent`." }
    type: { $ref: "#/components/schemas/SettingValueType" }
    label: { type: string }
    description: { type: string }
    defaultValue:
      description: The system default, which answers when no profile sets the key.
    scopes:
      type: array
      items: { $ref: "#/components/schemas/SettingScopeType" }
      description: The scope types the key may be set at, in fold order.
    min: { type: number }
    max: { type: number }
    scale: { type: integer }
    minDuration: { type: string }
    maxDuration: { type: string }
    maxLength: { type: integer }
    format: { $ref: "#/components/schemas/SettingStringFormat" }
    allowedValues:
      type: array
      items: { type: string }
    jsonProperties:
      type: object
      additionalProperties: { $ref: "#/components/schemas/SettingValueType" }
      description: JSON only. Each property a value may carry, and its type.
    requiredProperties:
      type: array
      items: { type: string }
      description: JSON only. The properties a value must carry.
    userPreference:
      type: boolean
      description: Whether a person sets it for themself through `/settings/me`.
    category: { $ref: "#/components/schemas/SettingCategory" }
    effectiveDated:
      type: boolean
      description: |
        Every version carries the day it takes effect from (`versions`), and a
        version in force is never changed: a change is a new version dated
        today or later.
    tenantOverridable:
      type: boolean
      description: False when only the platform operator sets it; tenants read the platform's value.
  required: [key, type, label, description, scopes, userPreference, category, effectiveDated, tenantOverridable]

SettingDefinitionSlice:
  type: object
  properties:
    items:
      type: array
      items: { $ref: "#/components/schemas/SettingDefinition" }
    nextCursor: { type: string }
    hasMore: { type: boolean }
  required: [items, hasMore]

SettingSource:
  type: object
  description: Where an effective value came from.
  properties:
    kind:
      type: string
      enum: [SYSTEM_DEFAULT, PROFILE]
    scopeType: { $ref: "#/components/schemas/SettingScopeType" }
    scopeId: { type: string, format: uuid }
    profileId: { type: string, format: uuid }
    profileName: { type: string }
    effectiveFrom:
      type: string
      format: date
      description: The first day of the version that applies; absent for an undated value.
  required: [kind]

EffectiveSetting:
  type: object
  properties:
    key: { type: string }
    type: { $ref: "#/components/schemas/SettingValueType" }
    category: { $ref: "#/components/schemas/SettingCategory" }
    label: { type: string }
    value:
      description: The effective value, typed as the definition says.
    source: { $ref: "#/components/schemas/SettingSource" }
  required: [key, type, category, label, source]

EffectiveSettings:
  type: object
  properties:
    items:
      type: array
      items: { $ref: "#/components/schemas/EffectiveSetting" }
  required: [items]

SettingProfile:
  type: object
  properties:
    id: { type: string, format: uuid }
    scopeType: { $ref: "#/components/schemas/SettingScopeType" }
    scopeId: { type: string, format: uuid }
    scopeLabel:
      type: string
      description: The unit's name and path, the customer's code and name, the vehicle's registration.
    country:
      type: string
      description: A platform profile's country (ISO 3166-1 alpha-2); absent for every country.
    state:
      type: string
      description: A platform profile's state within its country.
    name: { type: string }
    values:
      type: object
      additionalProperties: true
      description: Key to the value in effect today, from this profile alone.
    versions:
      type: array
      items: { $ref: "#/components/schemas/SettingValueVersion" }
      description: Every stored version, by key then day.
    version:
      type: integer
      format: int64
      description: The optimistic-lock version, also the `ETag`.
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }
  required: [id, scopeType, name, values, versions, version, createdAt, updatedAt]

SettingValueVersion:
  type: object
  properties:
    key: { type: string }
    effectiveFrom:
      type: string
      format: date
      description: Absent for an undated value.
    value:
      description: The version's value.
    status:
      type: string
      enum: [IN_FORCE, SUPERSEDED, SCHEDULED]
      description: |
        `IN_FORCE` applies today; `SUPERSEDED` was in force and has been
        replaced by a later version; `SCHEDULED` takes effect on a day still to
        come, and is the only kind that may still be changed or removed.
  required: [key, status]

SettingVersionRequest:
  type: object
  properties:
    key: { type: string, maxLength: 100 }
    effectiveFrom:
      type: string
      format: date
      description: Today or later for a new version.
    value:
      description: The value from that day; null removes a version not yet in force.
  required: [key, effectiveFrom]

SettingProfileSlice:
  type: object
  properties:
    items:
      type: array
      items: { $ref: "#/components/schemas/SettingProfile" }
    nextCursor: { type: string }
    hasMore: { type: boolean }
  required: [items, hasMore]

CreateSettingProfileRequest:
  type: object
  properties:
    scopeType: { $ref: "#/components/schemas/SettingScopeType" }
    scopeId:
      type: string
      format: uuid
      description: The unit, customer or vehicle; omitted for ORG_DEFAULT and PLATFORM.
    country:
      type: string
      maxLength: 2
      description: PLATFORM only. The jurisdiction's country; omitted for every country.
    state:
      type: string
      maxLength: 3
      description: PLATFORM only. A state within `country`.
    name:
      type: string
      maxLength: 100
      description: Required except for ORG_DEFAULT, which defaults to "Organisation default".
    values:
      type: object
      additionalProperties: true
      description: Key to its undated value. An effective-dated key needs `versions` instead.
    versions:
      type: array
      items: { $ref: "#/components/schemas/SettingVersionRequest" }
      description: Dated versions.
  required: [scopeType]

UpdateSettingProfileRequest:
  type: object
  properties:
    name: { type: string, maxLength: 100, description: A new name; omitted keeps the current one. }
    values:
      type: object
      additionalProperties: true
      description: Key to its undated value; null removes it, a key not mentioned is kept.
    versions:
      type: array
      items: { $ref: "#/components/schemas/SettingVersionRequest" }
      description: Dated versions to add, change or (with a null value) remove; only scheduled ones may change.

MyPreferences:
  type: object
  properties:
    version:
      type: integer
      format: int64
      description: Also the `ETag`; 0 before the first save.
    values:
      type: object
      additionalProperties: true
      description: What the caller has set.
    effective:
      type: array
      items: { $ref: "#/components/schemas/EffectiveSetting" }
      description: Every personal preference as it applies to the caller.
  required: [version, values, effective]

UpdateMyPreferencesRequest:
  type: object
  properties:
    values:
      type: object
      additionalProperties: true
      description: Key to value; null clears it.
  required: [values]

SettingOrgUnit:
  type: object
  properties:
    id: { type: string, format: uuid }
    name: { type: string }
    path: { type: string }
    unitType: { type: string }
  required: [id, name, path, unitType]

SettingOrgUnitSlice:
  type: object
  properties:
    items:
      type: array
      items: { $ref: "#/components/schemas/SettingOrgUnit" }
    nextCursor: { type: string }
    hasMore: { type: boolean }
  required: [items, hasMore]
