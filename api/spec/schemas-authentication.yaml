# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

AuthResult:
  type: object
  properties:
    accessToken: { type: string }
    accessTokenExpiresAt: { type: string, format: date-time }
    refreshToken:
      type: string
      description: Opaque. Returned once and stored only as a hash.
    refreshTokenExpiresAt: { type: string, format: date-time }
    tokenType: { type: string, enum: [Bearer] }
    userId: { type: string, format: uuid }
    tenantId: { type: string, format: uuid }
    orgUnitId:
      type: string
      format: uuid
      description: The caller's own organisational unit -- what create
        requests name as `orgUnitId` when filing under the caller's unit.
    orgPath: { type: string }
    permissions:
      type: array
      items: { type: string }
  required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]

LoginRequest:
  type: object
  description: |
    The tenant code is required as well as the credentials. Email addresses
    are unique per tenant rather than globally, so the same person may
    legitimately hold accounts with two customers of the platform.
  properties:
    tenantCode: { type: string }
    email: { type: string, format: email }
    password: { type: string, format: password }
    deviceFingerprint:
      type: string
      description: Optional. Binds a driver's long-lived refresh token to a device.
  required: [tenantCode, email, password]

RefreshRequest:
  type: object
  properties:
    refreshToken: { type: string }
  required: [refreshToken]
