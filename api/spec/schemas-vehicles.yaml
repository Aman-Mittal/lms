# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

Vehicle:
  type: object
  properties:
    id: { type: string, format: uuid }
    registrationNo: { type: string }
    category: { type: string }
    vehicleType: { type: string }
    axleConfig: { type: string }
    status: { type: string, enum: [AVAILABLE, ON_TRIP, MAINTENANCE, RETIRED] }
    grossWeightKg: { type: number }
    tareWeightKg: { type: number }
    payloadCapacityKg:
      type: number
      description: Gross less tare -- what the lorry carries once it has carried itself.
    maxVolumeM3: { type: number }
    hazmatCertified: { type: boolean }
    reeferCapable: { type: boolean }
    ownerPartnerId: { type: string, format: uuid }
    ownerPartnerName: { type: string }
    earliestDocumentExpiry:
      type: string
      format: date
      description: The soonest certificate to lapse; what a dispatcher must act on.
    expiredDocumentCount: { type: integer }
    createdAt: { type: string, format: date-time }

RegisterVehicleRequest:
  type: object
  properties:
    orgUnitId: { type: string, format: uuid }
    ownerPartnerId: { type: string, format: uuid }
    registrationNo: { type: string }
    category: { type: string }
    vehicleType: { type: string }
    axleConfig: { type: string }
    grossWeightKg: { type: number }
    tareWeightKg: { type: number }
    maxVolumeM3: { type: number }
    hazmatCertified: { type: boolean }
    reeferCapable: { type: boolean }
  required: [orgUnitId, registrationNo, category, vehicleType, grossWeightKg, tareWeightKg]

VehicleSlice:
  type: object
  description: One page. No total and no page number -- both need the scan
    keyset pagination exists to avoid.
  properties:
    items:
      type: array
      items: { $ref: "#/components/schemas/Vehicle" }
    nextCursor:
      type: string
      description: Pass as `cursor` for the next page. Null on the last.
    hasMore: { type: boolean }
  required: [items, hasMore]
