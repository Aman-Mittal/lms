# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

/api/v1/trips:
  get:
    tags: [Trips]
    operationId: listTrips
    summary: A page of trips
    parameters:
      - $ref: "#/components/parameters/status"
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
    responses:
      "200":
        description: One page of trips.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
  post:
    tags: [Trips]
    operationId: raiseTrip
    summary: Raise a trip against an awarded load
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RaiseTripRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/trips/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Trips]
    operationId: getTrip
    summary: One trip
    responses:
      "200":
        description: The trip.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Trip" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/trips/{id}/gate-log:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Trips]
    operationId: getGateLog
    summary: Gate events for a trip
    description: |
      Append-only in practice: this is the evidence in a detention dispute.
    responses:
      "200":
        description: Events in order.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/GateEvent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/trips/{id}/assignment:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Trips]
    operationId: assignTrip
    summary: Nominate the vehicle and driver
    description: |
      Compliance is checked here as well as at dispatch. A lorry whose
      insurance lapses on Tuesday assigned to a Wednesday departure fails now,
      while there is time to find another.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AssignTripRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

