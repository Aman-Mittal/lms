/api/v1/trips/{id}/weighings:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Trips]
    operationId: recordWeighing
    summary: Record a weighbridge ticket
    description: |
      The tare must be taken before the gross. The other way round means the
      'tare' was measured with freight aboard, and the payload computed from
      it is quietly wrong rather than obviously wrong.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WeighingRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

