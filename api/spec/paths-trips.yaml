/api/v1/trips/{id}/dispatch:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Trips]
    operationId: dispatchTrip
    summary: The compliance gate
    description: |
      Four checks, reported together so a dispatcher standing at a gate with a
      driver waiting learns everything that is wrong in one go: the trip's own
      statutory documents, the vehicle's and driver's documents against the
      departure date, hazmat certification where the load needs it, and the
      weighed payload against the manifest within tolerance.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MilestoneRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

