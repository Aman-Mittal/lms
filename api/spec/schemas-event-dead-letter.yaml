ParkedEventStatus:
  type: string
  enum: [PARKED, REPLAYED, DISCARDED]

ParkedEvent:
  type: object
  properties:
    id: { type: string, format: uuid }
    parkedNo:
      type: integer
      format: int64
      description: Orders the list; the cursor of a page is the last one's.
    eventType: { type: string }
    listenerId: { type: string }
    status: { $ref: "#/components/schemas/ParkedEventStatus" }
    attempts: { type: integer }
    firstFailedAt: { type: string, format: date-time }
    lastFailedAt: { type: string, format: date-time }
    lastError: { type: string }
    parkedAt: { type: string, format: date-time }
    publicationDate: { type: string, format: date-time }
    resolvedAt: { type: string, format: date-time }
    resolutionNote: { type: string }
  required: [id, parkedNo, eventType, listenerId, status, attempts]

ParkedEventSlice:
  type: object
  description: One page. No total and no page number -- both need the scan
    keyset pagination exists to avoid.
  properties:
    items:
      type: array
      items: { $ref: "#/components/schemas/ParkedEvent" }
    nextCursor:
      type: string
      description: Pass as `cursor` for the next page. Null on the last.
    hasMore: { type: boolean }
  required: [items, hasMore]

ParkedEventDetail:
  type: object
  properties:
    summary: { $ref: "#/components/schemas/ParkedEvent" }
    payload:
      type: string
      description: The event exactly as the registry serialized it (JSON).
  required: [summary, payload]

ParkedEventReplay:
  type: object
  properties:
    outcome:
      type: string
      enum: [REPLAYED, PARKED_AGAIN]
    attempts: { type: integer }
  required: [outcome, attempts]

DiscardParkedEventRequest:
  type: object
  properties:
    reason: { type: string, maxLength: 500 }
  required: [reason]
