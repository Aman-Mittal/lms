# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

/api/v1/telematics/pings:
  post:
    tags: [Telematics]
    operationId: ingestPings
    summary: Ingest a batch of positions
    description: |
      Answers 202 with a report of what happened. Geofence crossings evaluated
      here drive the trip state machine: leaving the origin puts a trip in
      transit, entering the destination marks it arrived.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PingBatchRequest" }
    responses:
      "202":
        description: Accepted for processing.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestResult" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/telematics/positions:
  get:
    tags: [Telematics]
    operationId: listPositions
    summary: Where every vehicle was last seen
    responses:
      "200":
        description: |
          Latest position per vehicle. Not paginated: one row per vehicle that
          has reported, so the list is as long as the fleet.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/VehiclePosition" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }

/api/v1/telematics/positions/{vehicleId}:
  parameters:
    - name: vehicleId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the vehicle.
  get:
    tags: [Telematics]
    operationId: getPosition
    summary: Where one vehicle was last seen
    responses:
      "200":
        description: The latest position.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehiclePosition" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/telematics/trips/{tripId}/crossings:
  parameters:
    - name: tripId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the trip.
  get:
    tags: [Telematics]
    operationId: listCrossings
    summary: Geofence crossings recorded against a trip
    responses:
      "200":
        description: Crossings in order.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/GeofenceCrossing" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/telematics/trips/{tripId}/track:
  parameters:
    - name: tripId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the trip.
  get:
    tags: [Telematics]
    operationId: getTrack
    summary: The shape of a trip's journey
    description: |
      Raw points while the trip runs, the simplified polyline once retention
      has collapsed it. The caller cannot tell which and should not need to.

      With `afterSeq` only the raw points recorded after that cursor are
      returned, oldest first, at most 5000 a call, each as `[lon, lat, seq]`:
      `seq` is the point's recorded time in epoch microseconds and the
      `afterSeq` of the next call (`0` reads from the start). It is what a
      console that cached the track asks for, so the cost is the new points.
      When the trip has no raw points at all the simplified polyline comes
      back as two-element pairs, which means: what you hold is obsolete,
      replace it. A point that arrives late and is dated before the cursor is
      not returned.
    parameters:
      - name: afterSeq
        in: query
        required: false
        schema: { type: integer, format: int64, minimum: 0 }
        description: The `seq` of the last point already held.
    responses:
      "200":
        description: "`[lon, lat]` pairs, GeoJSON order; `[lon, lat, seq]` triples with `afterSeq`."
        content:
          application/json:
            schema:
              type: array
              items:
                type: array
                items: { type: number }
                minItems: 2
                maxItems: 3
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/telematics/trips/{tripId}/progress:
  parameters:
    - name: tripId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the trip.
  get:
    tags: [Telematics]
    operationId: getProgress
    summary: How far along a trip is
    responses:
      "200":
        description: Progress and an estimated arrival.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripProgress" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/telematics/deviations:
  get:
    tags: [Telematics]
    operationId: listOpenDeviations
    summary: Vehicles currently off their corridor
    responses:
      "200":
        description: Open deviations.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/Deviation" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }

/api/v1/telematics/corridors:
  get:
    tags: [Telematics]
    operationId: listRouteCorridors
    summary: Imported route corridors
    description: Without their positions. Keyset-paged by lane.
    parameters:
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
    responses:
      "200":
        description: One page of corridors.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteCorridorSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
  put:
    tags: [Telematics]
    operationId: importRouteCorridor
    summary: Import the corridor of a lane
    description: |
      Requires `TELEMATICS_INGEST`. Route corridors are import only: the
      platform draws no routes, it measures against the polyline it is given.
      A trip whose origin and destination are the lane's is then measured for
      route deviation against this polyline (the deviation's `reference` is
      `CORRIDOR`) instead of the straight line, which remains the fallback for
      every lane without one. Replaces the lane's corridor if it has one.
      Positions are `[lon, lat]`, 2 to 5000 (`route-corridor-points-invalid`);
      the terminals must differ (`route-corridor-lane-invalid`). Audited.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RouteCorridorRequest" }
    responses:
      "200":
        description: The corridor's identifier.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IdResponse" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/telematics/corridors/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the corridor.
  get:
    tags: [Telematics]
    operationId: getRouteCorridor
    summary: One corridor with its positions
    responses:
      "200":
        description: The corridor.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteCorridor" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
  delete:
    tags: [Telematics]
    operationId: clearRouteCorridor
    summary: Clear a corridor
    description: Requires `TELEMATICS_INGEST`. Its lane's trips are measured against the straight line again.
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
