# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

cursor:
  name: cursor
  in: query
  required: false
  schema: { type: string }
  description: The `nextCursor` of the previous page. Omit for the first.

limit:
  name: limit
  in: query
  required: false
  schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  description: Page size. Clamped to 200 whatever is asked for.

status:
  name: status
  in: query
  required: false
  schema: { type: string }
  description: Restricts the listing to one status.

idempotencyKey:
  name: Idempotency-Key
  in: header
  required: false
  schema: { type: string, maxLength: 255 }
  description: |
    Opt-in deduplication. A retry with the same key returns the original
    response and `Idempotent-Replay: true` rather than acting twice. Reusing
    a key for a *different* request is refused with 409: that is a client
    defect, and answering it with the earlier response would hide the defect
    while returning an answer to a question nobody asked.
