# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

/api/v1/users:
  get:
    tags: [Users]
    operationId: listUsers
    summary: Users visible to the caller
    description: |
      Bounded by the caller's own organisational path: a branch manager sees
      their branch and everything under it and nothing above. There is no
      unfiltered listing to ask for, which is why there are no parameters.
    responses:
      "200":
        description: Users the caller may see.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/User" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }

/api/v1/users/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Users]
    operationId: getUser
    summary: One user
    responses:
      "200":
        description: The user.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/User" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/users/{id}/permissions:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Users]
    operationId: getUserPermissions
    summary: What one user is permitted to do
    description: |
      Separate from the user document: an administrator auditing access asks a
      different question at a different time from a screen rendering a name,
      and joining it in would make every listing pay for it.
    responses:
      "200":
        description: |
          Permission codes. An unknown id, or one that belongs to another
          tenant, is an empty list and not a 404.
        content:
          application/json:
            schema:
              type: array
              items: { type: string }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
