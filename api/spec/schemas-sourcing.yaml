# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

Allocation:
  type: object
  properties:
    id: { type: string, format: uuid }
    loadId: { type: string, format: uuid }
    loadNo: { type: string }
    strategy: { type: string, enum: [CONTRACTUAL, ROUND_ROBIN] }
    status: { type: string }
    pendingVendorName:
      type: string
      description: The vendor whose offer is open. Absent once the load is awarded.
    respondsBy:
      type: string
      format: date-time
      description: When the open offer lapses. Absent when no offer is open.
    awardedVendorName: { type: string }
    awardedAt: { type: string, format: date-time }
    currentRank: { type: integer }
    offersMade:
      type: integer
      description: How many offers the cascade has made so far, answered or not.
    createdAt: { type: string, format: date-time }

Offer:
  type: object
  properties:
    id: { type: string, format: uuid }
    vendorPartnerId: { type: string, format: uuid }
    vendorName: { type: string }
    rankNo: { type: integer }
    outcome:
      type: string
      enum: [PENDING, ACCEPTED, REJECTED, TIMED_OUT, CANCELLED]
    offeredAt: { type: string, format: date-time }
    respondsBy:
      type: string
      format: date-time
      description: When the offer lapses if the vendor has not answered.
    respondedAt: { type: string, format: date-time }

AllocateRequest:
  type: object
  properties:
    loadId: { type: string, format: uuid }
  required: [loadId]

VendorResponseRequest:
  type: object
  description: |
    The vendor is named even though the caller is authenticated. Most
    rejections reach the system by telephone, entered by a dispatcher acting
    on the vendor's behalf -- who is not the vendor. The service checks the
    offer is actually held by the vendor named.
  properties:
    vendorPartnerId: { type: string, format: uuid }
  required: [vendorPartnerId]

AllocationSlice:
  type: object
  description: One page. No total and no page number -- both need the scan
    keyset pagination exists to avoid.
  properties:
    items:
      type: array
      items: { $ref: "#/components/schemas/Allocation" }
    nextCursor:
      type: string
      description: Pass as `cursor` for the next page. Null on the last.
    hasMore: { type: boolean }
  required: [items, hasMore]

RoutingGuide:
  type: object
  properties:
    id: { type: string, format: uuid }
    originTerminalCode: { type: string }
    destinationTerminalCode: { type: string }
    vehicleType: { type: string }
    strategy: { type: string, enum: [CONTRACTUAL, ROUND_ROBIN] }
    active: { type: boolean }
    entries:
      type: array
      description: Vendors in rank order.
      items:
        type: object
        properties:
          rankNo: { type: integer }
          vendorPartnerId: { type: string, format: uuid }
          vendorName: { type: string }
          responseSlaMinutes: { type: integer }
          agreedRate: { type: number }

DefineGuideRequest:
  type: object
  properties:
    orgUnitId: { type: string, format: uuid }
    originTerminalId: { type: string, format: uuid }
    destinationTerminalId: { type: string, format: uuid }
    vehicleType: { type: string }
    strategy:
      type: string
      enum: [CONTRACTUAL, ROUND_ROBIN]
      description: Defaults to CONTRACTUAL.
  required: [orgUnitId, originTerminalId, destinationTerminalId, vehicleType]

AddVendorRequest:
  type: object
  properties:
    vendorPartnerId: { type: string, format: uuid }
    rankNo: { type: integer, minimum: 1 }
    responseSlaMinutes:
      type: integer
      minimum: 1
      description: How long the vendor has to answer an offer before it
        cascades to the next rank.
    agreedRate: { type: number, minimum: 0 }
  required: [vendorPartnerId, rankNo, responseSlaMinutes]
