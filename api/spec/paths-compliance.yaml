# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

/api/v1/compliance/expiring:
  get:
    tags: [Compliance]
    operationId: listExpiringDocuments
    summary: Certificates that have lapsed or are about to
    description: |
      Spans vehicles, drivers and partners, because the question does.
      Includes what has already expired: a list of what is about to lapse that
      omits what already has answers 'is anything wrong' with 'no' on the day
      it matters most.
    parameters:
      - name: withinDays
        in: query
        schema: { type: integer, minimum: 0, maximum: 3650, default: 30 }
        description: How far ahead to look. Already-expired documents are
          always included.
    responses:
      "200":
        description: Soonest first.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/ComplianceDocument" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
