Role:
  type: object
  properties:
    id: { type: string, format: uuid }
    code: { type: string }
    name: { type: string }
    standard: { type: boolean, description: One of the five roles every tenant starts with. }
    userCount: { type: integer, format: int64, description: How many users hold it. }
    version: { type: integer, format: int64, description: The version an edit sends as `If-Match`. }
    permissions:
      type: array
      items: { type: string }
      description: The permission codes it grants.

CreateRoleRequest:
  type: object
  properties:
    code: { type: string, description: "2 to 40 characters: capitals, digits and underscores, starting with a letter." }
    name: { type: string }
    permissions:
      type: array
      items: { type: string }
  required: [code, name]

UpdateRoleRequest:
  type: object
  properties:
    name: { type: string }
    permissions:
      type: array
      items: { type: string }
      description: The complete set of permission codes the role should grant.
  required: [name]

PermissionEntry:
  type: object
  properties:
    code: { type: string }
    resource: { type: string }
    action: { type: string, enum: [CREATE, READ, UPDATE, DELETE, EXECUTE] }
