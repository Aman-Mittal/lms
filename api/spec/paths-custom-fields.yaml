/api/v1/custom-fields/definitions:
  get:
    tags: [Custom fields]
    operationId: listCustomFieldDefinitions
    summary: The custom fields a tenant has defined
    description: |
      Requires `CUSTOM_FIELD_READ`. The active definitions, in display order,
      unless `status` says INACTIVE or ALL. A tenant has a handful, so this is
      one slice with no cursor.
    parameters:
      - $ref: "#/components/parameters/activeStatus"
      - name: entityType
        in: query
        description: Only the fields of this kind of record.
        schema: { $ref: "#/components/schemas/CustomFieldEntityType" }
    responses:
      "200":
        description: The definitions.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomFieldDefinitionSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
  post:
    tags: [Custom fields]
    operationId: defineCustomField
    summary: Define a custom field
    description: |
      Requires `CUSTOM_FIELD_MANAGE`. The key and the type cannot be changed
      afterwards. A key is unique per kind of record.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DefineCustomFieldRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/custom-fields/definitions/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the definition.
  get:
    tags: [Custom fields]
    operationId: getCustomFieldDefinition
    summary: One custom field definition
    description: Requires `CUSTOM_FIELD_READ`. The `ETag` is the version `PUT` sends back in `If-Match`.
    responses:
      "200":
        description: The definition.
        headers:
          ETag:
            schema: { type: string }
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomFieldDefinition" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
  put:
    tags: [Custom fields]
    operationId: reviseCustomField
    summary: Change a custom field
    description: |
      Requires `CUSTOM_FIELD_MANAGE`. Changes the label, whether it is
      required, its options and its place. A stale `If-Match` is 409
      `concurrent-modification`. To retire a field use `POST /{id}/deactivate`.
    parameters:
      - $ref: "#/components/parameters/ifMatch"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReviseCustomFieldRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/custom-fields/definitions/{id}/deactivate:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the definition.
  post:
    tags: [Custom fields]
    operationId: deactivateCustomField
    summary: Switch a custom field off, with a reason
    description: |
      Requires `CUSTOM_FIELD_MANAGE`. An inactive field is no longer asked for, validated
      or required; the values already stored under it are kept and come back with it. 409
      `custom-field-already-inactive` when already off. Audited as
      `CUSTOM_FIELD_DEACTIVATED` with the reason.
    parameters:
      - $ref: "#/components/parameters/ifMatchOptional"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReasonRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/custom-fields/definitions/{id}/reactivate:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the definition.
  post:
    tags: [Custom fields]
    operationId: reactivateCustomField
    summary: Switch a custom field back on, with a reason
    description: |
      Requires `CUSTOM_FIELD_MANAGE`. 409 `custom-field-not-inactive` when already on.
      Audited as `CUSTOM_FIELD_REACTIVATED` with the reason.
    parameters:
      - $ref: "#/components/parameters/ifMatchOptional"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReasonRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/custom-fields/values/{entityType}/{entityId}:
  parameters:
    - name: entityType
      in: path
      required: true
      schema: { $ref: "#/components/schemas/CustomFieldEntityType" }
    - name: entityId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the record.
  get:
    tags: [Custom fields]
    operationId: getCustomFieldValues
    summary: The custom values of one record
    description: Requires `CUSTOM_FIELD_READ`. Empty when nothing has been recorded.
    responses:
      "200":
        description: The values, keyed by field key.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomFieldValues" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
  put:
    tags: [Custom fields]
    operationId: setCustomFieldValues
    summary: Replace the custom values of one record
    description: |
      Requires `CUSTOM_FIELD_WRITE`. Replaces, not merges: a field left out is
      cleared. Every value is checked against its definition and every
      required field must be present; the answer lists everything wrong at
      once (`code: custom-field-invalid`). The record must exist in this
      tenant.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CustomFieldValues" }
    responses:
      "200":
        description: The values as stored.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomFieldValues" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }
