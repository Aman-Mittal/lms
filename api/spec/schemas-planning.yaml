# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

Consignment:
  type: object
  properties:
    id: { type: string, format: uuid }
    trackingRef: { type: string }
    status:
      type: string
      description: |
        PLANNED, ASSIGNED_TO_LOAD, IN_TRANSIT, DELIVERED or CANCELLED. A full
        truckload is IN_TRANSIT once its trip is dispatched, and DELIVERED
        when the trip completes or its proof of delivery is confirmed,
        whichever comes first. An LTL
        docket also passes through the hub states: its line haul's trip
        completing leaves it ARRIVED_AT_HUB, a delivery load from that hub
        makes it ASSIGNED_TO_DELIVERY, and that load's dispatch makes it
        OUT_FOR_DELIVERY, before DELIVERED.
        A planned full truckload split across vehicles becomes SPLIT, for
        good: it carries nothing itself, and its parts carry it.
    orderId:
      type: string
      format: uuid
      description: The order it was cut from; absent for one received from a
        warehouse hand-off.
    orderNo: { type: string }
    consigneeName: { type: string }
    destinationTerminalCode: { type: string }
    totalDeadWeightKg: { type: number }
    totalVolumeM3: { type: number }
    chargeableWeightKg: { type: number }
    containsHazmat: { type: boolean }
    materialClasses: { type: string }
    loadNo:
      type: string
      description: The load it is on, or was last on -- for a docket, its
        delivery load once it has one, otherwise its line haul.
    freightMode:
      type: string
      description: LTL consignments are dockets, numbered `DKT-` rather than
        `LR-`, and carry the hub pair below.
    originHubCode: { type: string }
    destinationHubCode: { type: string }
    handlingUnitId:
      type: string
      format: uuid
      description: The warehouse handling unit this consignment carries,
        when it was received from a warehouse hand-off rather than cut from
        an order. One unit becomes at most one consignment.
    handlingUnitNo: { type: string }
    parentConsignmentId:
      type: string
      format: uuid
      description: For a part of a split consignment, the consignment it is a
        part of.
    parentTrackingRef: { type: string }
    partCount:
      type: integer
      description: For a SPLIT consignment, how many parts it became.
    partsDelivered:
      type: integer
      description: For a SPLIT consignment, how many of its parts have been
        delivered.
    partsCancelled:
      type: integer
      description: For a SPLIT consignment, how many of its parts have been
        cancelled.
    proofStatus:
      type: string
      enum: [OTP_ISSUED, CONFIRMED, REVERSED]
      description: Where its proof of delivery stands; absent before a code
        has been issued.
    proofCondition:
      type: string
      enum: [CLEAN, SHORTAGE, DAMAGE]
      description: The goods' condition on the proof; absent before a code
        has been issued, and CLEAN until a proof says otherwise.
    contactName:
      type: string
      description: Who to call at the consignee; absent until stated.
    contactPhone: { type: string }
    consigneeReference:
      type: string
      description: The consignee's own reference for the delivery.
    clientReference:
      type: string
      description: The client's own reference for the consignment, unique
        within the tenant; absent when none was given.
    deliveryWindowFrom:
      type: string
      format: date-time
      description: The earliest the consignee will receive it.
    deliveryWindowTo:
      type: string
      format: date-time
      description: The latest the consignee will receive it.
    remarks: { type: string }
    version:
      type: integer
      format: int64
      description: The optimistic-lock version, also the `ETag`; what an
        amendment sends back in `If-Match`.

ConsignmentAmendmentRequest:
  type: object
  description: |
    The particulars to change, by name; each is text, empty text to clear it,
    or null (or left out) to keep it.
    Amendable: `contactName` (at most 120 characters), `contactPhone` (digits,
    spaces, brackets and dashes, optionally a leading +, 5 to 40 characters),
    `consigneeReference` (at most 80), `clientReference` (letters, digits, dot,
    slash, dash and underscore, starting with a letter or digit, at most 80),
    `deliveryWindowFrom` and `deliveryWindowTo` (ISO-8601 instants, the window
    never ending before it starts), and `remarks` (at most 500). Naming what
    the consignment carries -- `totalDeadWeightKg`, `totalVolumeM3`,
    `chargeableWeightKg`, `lines`, `materialClasses`, `containsHazmat`,
    `consigneePartnerId`, `destinationTerminalId` and the like -- is refused
    with `consignment-contents-fixed`, as is any other name with
    `consignment-amendment-invalid`. At least one field.
  properties:
    contactName: { type: string }
    contactPhone: { type: string }
    consigneeReference: { type: string }
    clientReference: { type: string }
    deliveryWindowFrom: { type: string }
    deliveryWindowTo: { type: string }
    remarks: { type: string }

AmendmentFieldResult:
  type: object
  properties:
    field: { type: string }
    outcome:
      type: string
      enum: [APPLIED, UNCHANGED, REFUSED]
    code:
      type: string
      description: Why it was refused; absent otherwise.
    message: { type: string }
  required: [field, outcome]

ConsignmentAmended:
  type: object
  properties:
    consignmentId: { type: string, format: uuid }
    version:
      type: integer
      format: int64
      description: The version now; unchanged when every field was UNCHANGED.
    fields:
      type: array
      description: Each named field's outcome, in the order named.
      items: { $ref: "#/components/schemas/AmendmentFieldResult" }
  required: [consignmentId, version, fields]

BulkAmendConsignmentItem:
  type: object
  properties:
    consignmentId: { type: string, format: uuid }
    version:
      type: integer
      format: int64
      description: The version the caller read, as `If-Match` carries it for one.
    changes: { $ref: "#/components/schemas/ConsignmentAmendmentRequest" }
  required: [consignmentId, version, changes]

BulkAmendConsignmentsRequest:
  type: object
  properties:
    items:
      type: array
      minItems: 1
      maxItems: 200
      items: { $ref: "#/components/schemas/BulkAmendConsignmentItem" }
  required: [items]

CancelConsignmentRequest:
  type: object
  properties:
    reason:
      type: string
      maxLength: 500
      description: Why, for the history and the webhook; optional.

BulkCancelConsignmentsRequest:
  type: object
  properties:
    consignmentIds:
      type: array
      minItems: 1
      maxItems: 200
      items: { type: string, format: uuid }
    reason:
      type: string
      maxLength: 500
      description: Recorded against every consignment cancelled.
  required: [consignmentIds]

ConsignmentItemResult:
  type: object
  properties:
    consignmentId: { type: string, format: uuid }
    outcome:
      type: string
      enum: [AMENDED, CANCELLED, REFUSED]
    code:
      type: string
      description: For a refused item, the code one request would have answered.
    message: { type: string }
    version:
      type: integer
      format: int64
      description: For an amended item, its version now.
    fields:
      type: array
      description: For an amended item, each named field's outcome.
      items: { $ref: "#/components/schemas/AmendmentFieldResult" }
    errors:
      type: object
      additionalProperties: { type: string }
      description: For an amendment refused field by field, each refused field
        to its reason.
  required: [consignmentId, outcome]

ConsignmentBulkResult:
  type: object
  properties:
    items:
      type: array
      items: { $ref: "#/components/schemas/ConsignmentItemResult" }
  required: [items]

LoadAfterCancellation:
  type: object
  description: The load a cancelled consignment was taken off, as it now stands.
  properties:
    loadId: { type: string, format: uuid }
    loadNo: { type: string }
    status:
      type: string
      description: CANCELLED when nothing was left aboard.
    plannedWeightKg: { type: number }
    plannedVolumeM3: { type: number }
  required: [loadId, loadNo, status, plannedWeightKg, plannedVolumeM3]

ConsignmentCancellation:
  type: object
  properties:
    consignmentId: { type: string, format: uuid }
    trackingRef: { type: string }
    releasedLineIds:
      type: array
      description: The order lines it was cut from, now waiting to be planned again.
      items: { type: string, format: uuid }
    load: { $ref: "#/components/schemas/LoadAfterCancellation" }
  required: [consignmentId, trackingRef, releasedLineIds]

SplitConsignmentRequest:
  type: object
  description: |
    The parts a consignment is split into, each to go on its own vehicle. Their
    dead weights and volumes must add up exactly to the consignment's.
  properties:
    parts:
      type: array
      description: 2 to 500 parts, in the order their references are numbered.
      items: { $ref: "#/components/schemas/SplitPartRequest" }
  required: [parts]

SplitPartRequest:
  type: object
  properties:
    deadWeightKg:
      type: number
      description: Above zero, to at most three decimal places.
    volumeM3:
      type: number
      description: Zero or more, to at most three decimal places.
  required: [deadWeightKg, volumeM3]

ConsignmentPart:
  type: object
  properties:
    id: { type: string, format: uuid }
    trackingRef:
      type: string
      description: The split consignment's reference, a dash, and the part
        number zero-padded to the width of the count (at least two digits).
  required: [id, trackingRef]

Load:
  type: object
  properties:
    id: { type: string, format: uuid }
    loadNo: { type: string }
    status: { type: string }
    originTerminalCode: { type: string }
    vehicleRegistrationNo: { type: string }
    vehicleType: { type: string }
    capacityWeightKg: { type: number }
    plannedWeightKg: { type: number }
    weightUtilisationPct: { type: number }
    volumeUtilisationPct: { type: number }
    capacityVolumeM3: { type: number }
    plannedVolumeM3: { type: number }
    requiresHazmat: { type: boolean }
    consignmentCount: { type: integer }
    freightMode: { type: string }
    ltlLeg:
      $ref: "#/components/schemas/LtlLeg"
    version:
      type: integer
      format: int64
      description: The optimistic-lock version, also the `ETag`. Send it back in
        `If-Match` to take a consignment off, un-plan or cancel the load.

CancelLoadRequest:
  type: object
  properties:
    reason:
      type: string
      maxLength: 500
      description: Why the load is cancelled; kept in its history.

OpenLoadRequest:
  type: object
  properties:
    orgUnitId: { type: string, format: uuid }
    loadNo: { type: string }
    originTerminalId: { type: string, format: uuid }
    vehicleId: { type: string, format: uuid }
    freightMode:
      $ref: "#/components/schemas/FreightMode"
    ltlLeg:
      $ref: "#/components/schemas/LtlLeg"
  required: [orgUnitId, loadNo, originTerminalId, vehicleId]

LtlLeg:
  type: string
  enum: [LINE_HAUL, DELIVERY]
  default: LINE_HAUL
  description: |
    Which leg of a part-load journey a load runs. A LINE_HAUL load
    consolidates dockets at their origin hub and carries them to their
    destination hub. A DELIVERY load is opened at a destination hub and
    takes dockets that have arrived there to their consignees. Only LTL
    loads may be DELIVERY loads (`delivery-leg-only-for-ltl`).

AssignConsignmentRequest:
  type: object
  properties:
    consignmentId: { type: string, format: uuid }
  required: [consignmentId]

BulkAssignConsignmentsRequest:
  type: object
  properties:
    consignmentIds:
      type: array
      minItems: 1
      maxItems: 500
      description: In the order they are to board, none repeated.
      items: { type: string, format: uuid }
  required: [consignmentIds]

LoadSlice:
  type: object
  description: One page. No total and no page number -- both need the scan
    keyset pagination exists to avoid.
  properties:
    items:
      type: array
      items: { $ref: "#/components/schemas/Load" }
    nextCursor:
      type: string
      description: Pass as `cursor` for the next page. Null on the last.
    hasMore: { type: boolean }
  required: [items, hasMore]

ConsignmentSlice:
  type: object
  description: One page. No total and no page number -- both need the scan
    keyset pagination exists to avoid.
  properties:
    items:
      type: array
      items: { $ref: "#/components/schemas/Consignment" }
    nextCursor:
      type: string
      description: Pass as `cursor` for the next page. Null on the last.
    hasMore: { type: boolean }
  required: [items, hasMore]
