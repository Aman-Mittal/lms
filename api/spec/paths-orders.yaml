# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

/api/v1/orders:
  get:
    tags: [Orders]
    operationId: listOrders
    summary: A page of orders
    parameters:
      - $ref: "#/components/parameters/status"
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/q"
    responses:
      "200":
        description: One page of orders.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
  post:
    tags: [Orders]
    operationId: raiseOrder
    summary: Raise an order
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RaiseOrderRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/orders/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Orders]
    operationId: getOrder
    summary: One order
    responses:
      "200":
        description: The order. Its `ETag` is the version to send in `If-Match`.
        headers:
          ETag:
            schema: { type: string }
            description: The order's version, quoted.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Order" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }

  put:
    tags: [Orders]
    operationId: updateOrder
    summary: Edit a draft order's header
    description: |
      Replaces the commercial header of an order that is still a draft. Refused
      with `order-not-editable` once it is validated (use the amendment instead),
      and with 409 `concurrent-modification` when `If-Match` is not the current
      version. The change is audited with before and after.
    parameters:
      - $ref: "#/components/parameters/ifMatch"
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/UpdateOrderRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/orders/{id}/lines:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Orders]
    operationId: listOrderLines
    summary: Lines on an order
    responses:
      "200":
        description: |
          Lines in order. An unknown id, or one that belongs to another tenant,
          is an empty list and not a 404.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/OrderLine" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
  post:
    tags: [Orders]
    operationId: addOrderLine
    summary: Add a line
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AddOrderLineRequest" }
    responses:
      "201": { $ref: "#/components/responses/Created" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

  put:
    tags: [Orders]
    operationId: replaceOrderLines
    summary: Replace the lines of a draft order
    description: |
      Replaces every line of a draft order with the given set, atomically.
      Refused with `order-not-editable` once the order is validated and with 409
      `concurrent-modification` when `If-Match` is not the current version.
    parameters:
      - $ref: "#/components/parameters/ifMatch"
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReplaceOrderLinesRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/orders/{id}/lines/{lineId}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
