/api/v1/loads/{id}/consignments:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Planning]
    operationId: listLoadConsignments
    summary: What is aboard a load
    responses:
      "200":
        description: |
          Consignments in drop sequence. An unknown id, or one that belongs to
          another tenant, is an empty list and not a 404: nothing is hidden or
          revealed by the answer.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/Consignment" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
  post:
    tags: [Planning]
    operationId: assignConsignment
    summary: Put a consignment on a load
    description: |
      Refused with 409 when it would exceed the vehicle's weight or volume, or
      when the material is incompatible with something already aboard. The
      capacity rule is also a database CHECK constraint. A DELIVERY load
      takes only dockets that have arrived at its hub
      (`docket-not-arrived-at-hub`, `docket-at-another-hub`).
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AssignConsignmentRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/loads/{id}/consignments/bulk:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Planning]
    operationId: assignConsignmentsInBulk
    summary: Put many consignments on a load at once, all or none
    description: |
      The rules of `assignConsignment`, applied to every consignment named:
      the load's freight mode, the status each must be in for the load's leg,
      the hub rules of a part load, dangerous-goods certification, and
      material compatibility against what is aboard and among the batch.
      Capacity is checked on the batch's total.

      All or none. When any consignment cannot board, nothing does, and the
      409 names every one of them at once: `code` is
      `load-bulk-assignment-refused`, and `errors` maps each refused
      consignment's tracking reference to its reasons, each written as
      `<code>: <reason>` and separated by `; `. A load that is not open
      (`load-not-open`) or a batch that would overload it
      (`load-capacity-exceeded`) is refused with the code a single
      assignment uses.

      Between 1 and 500 consignment ids, none repeated; anything else is 400
      `validation-failed`. An id that does not exist, or belongs to another
      tenant, is 404 `not-found`, as is an unknown load. Consignments board in
      the order given, after anything already aboard.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BulkAssignConsignmentsRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "404": { $ref: "#/components/responses/NotFound" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/loads/{id}/plan:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Planning]
    operationId: planLoad
    summary: Close a load to further building, making it sourceable
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/loads/{id}/consignments/{consignmentId}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the load.
    - name: consignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the consignment aboard.
  delete:
    tags: [Planning]
    operationId: removeConsignmentFromLoad
    summary: Take a consignment off a load before it is awarded or leaves
    description: |
      The consignment goes back to the status it boarded from -- PLANNED, or
      ARRIVED_AT_HUB for a docket on a delivery load -- and can be put on
      another load. The drops left behind are numbered again without a gap,
      and the load's weight, volume and dangerous-goods flag are restated
      from what is still aboard. Recorded in the history of the load
      (`LOAD_CONSIGNMENT_REMOVED`) and of the consignment
      (`CONSIGNMENT_REMOVED_FROM_LOAD`).

      Refused with 409:
      `load-dispatched` once the load has left;
      `load-awarded` while it is awarded (cancel the allocation first, which
      returns the load to PLANNED);
      `load-allocated` while a PLANNED load is out with a vendor;
      `load-cancelled` for a cancelled load;
      `load-would-be-empty` for the last consignment of a PLANNED load
      (un-plan or cancel the load instead);
      `consignment-not-on-load` when the consignment is not aboard this load;
      `concurrent-modification` when `If-Match` is not the load's current
      version. An unknown load or consignment is 404 `not-found`.
    parameters:
      - $ref: "#/components/parameters/ifMatch"
      - $ref: "#/components/parameters/idempotencyKey"
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/loads/{id}/unplan:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Planning]
    operationId: unplanLoad
    summary: Open a planned load for building again
    description: |
      A PLANNED load goes back to DRAFT with its freight untouched, and can no
      longer be offered to vendors until it is planned again. Recorded in the
      load's history as `LOAD_UNPLANNED`.

      Refused with 409: `load-not-planned` unless the load is PLANNED;
      `load-awarded`, `load-allocated`, `load-dispatched` and
      `load-cancelled` as for taking a consignment off;
      `concurrent-modification` for a stale `If-Match`.
    parameters:
      - $ref: "#/components/parameters/ifMatch"
      - $ref: "#/components/parameters/idempotencyKey"
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/loads/{id}/cancel:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Planning]
    operationId: cancelLoad
    summary: Cancel a load that has not left
    description: |
      A DRAFT, PLANNED or AWARDED load is cancelled, which is final. Every
      consignment aboard is released, as when one is taken off, rather than
      cancelled: its order still wants it carried. An allocation that is out
      with a vendor or awarded is cancelled with the load. Recorded in the
      load's history as `LOAD_CANCELLED` with the reason, and in each released
      consignment's as `CONSIGNMENT_REMOVED_FROM_LOAD`.

      Refused with 409: `load-dispatched` once the load has left;
      `load-already-cancelled` on a repeat; `load-has-active-trip` while a
      trip that is not cancelled is raised against the load;
      `concurrent-modification` for a stale `If-Match`.
    parameters:
      - $ref: "#/components/parameters/ifMatch"
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CancelLoadRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/consignments/{id}/history:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Planning]
    operationId: getConsignmentHistory
    summary: What has happened to the consignment, newest first
    description: |
      The consignment's audit trail: every recorded transition with who made it,
      when, and the state either side. Newest first, a page at a time by
      cursor. Readable by whoever can read the consignment; a consignment the caller
      cannot read is a 404 `not-found`, exactly as reading it is.
    parameters:
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
    responses:
      "200":
        description: One page of the history.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HistorySlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/loads/{id}/history:
  parameters:
    - name: id
