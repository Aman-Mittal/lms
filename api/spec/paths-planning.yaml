/api/v1/loads/{id}/consignments:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Planning]
    operationId: listLoadConsignments
    summary: What is aboard a load
    responses:
      "200":
        description: |
          Consignments in drop sequence. An unknown id, or one that belongs to
          another tenant, is an empty list and not a 404: nothing is hidden or
          revealed by the answer.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/Consignment" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
  post:
    tags: [Planning]
    operationId: assignConsignment
    summary: Put a consignment on a load
    description: |
      Refused with 409 when it would exceed the vehicle's weight or volume, or
      when the material is incompatible with something already aboard. The
      capacity rule is also a database CHECK constraint. A DELIVERY load
      takes only dockets that have arrived at its hub
      (`docket-not-arrived-at-hub`, `docket-at-another-hub`).
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AssignConsignmentRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/loads/{id}/consignments/bulk:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Planning]
    operationId: assignConsignmentsInBulk
    summary: Put many consignments on a load at once, all or none
    description: |
      The rules of `assignConsignment`, applied to every consignment named:
      the load's freight mode, the status each must be in for the load's leg,
      the hub rules of a part load, dangerous-goods certification, and
      material compatibility against what is aboard and among the batch.
      Capacity is checked on the batch's total.

      All or none. When any consignment cannot board, nothing does, and the
      409 names every one of them at once: `code` is
      `load-bulk-assignment-refused`, and `errors` maps each refused
      consignment's tracking reference to its reasons, each written as
      `<code>: <reason>` and separated by `; `. A load that is not open
      (`load-not-open`) or a batch that would overload it
      (`load-capacity-exceeded`) is refused with the code a single
      assignment uses.

      Between 1 and 500 consignment ids, none repeated; anything else is 400
      `validation-failed`. An id that does not exist, or belongs to another
      tenant, is 404 `not-found`, as is an unknown load. Consignments board in
      the order given, after anything already aboard.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BulkAssignConsignmentsRequest" }
    responses:
      "204": { $ref: "#/components/responses/NoContent" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "404": { $ref: "#/components/responses/NotFound" }
      "409": { $ref: "#/components/responses/Conflict" }

