# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

/api/v1/orders/{id}/consignments:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Planning]
    operationId: generateConsignments
    summary: Generate consignments from an order
    description: |
      One consignment per consignee and destination. The grouping rule belongs
      to planning; letting a client post consignments would move it to the
      client.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    responses:
      "201":
        description: The consignments generated.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/IdResponse" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/consignments/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Planning]
    operationId: getConsignment
    summary: One consignment
    responses:
      "200":
        description: The consignment. Its `ETag` is the version to send in `If-Match` when amending it.
        headers:
          ETag:
            schema: { type: string }
            description: The consignment's version, quoted.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Consignment" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
  patch:
    tags: [Planning]
    operationId: amendConsignment
    summary: Amend a consignment's particulars
    description: |
      Changes what is said about a consignment -- the consignee contact name,
      phone and reference, the delivery window, the client's reference, and
      remarks -- and nothing it carries. The body names only the fields that
      change; a field set to empty text is cleared, and a field left out or
      sent as null is kept, so a client whose model writes every property
      changes only what it set. Needs `LOAD_CREATE`.

      Allowed only while the consignment is PLANNED, which also means it is on
      no load; refused with 409 `consignment-not-amendable` otherwise. The
      version from the last read goes in `If-Match`; a stale one is 409
      `concurrent-modification`.

      Judged field by field and applied all or nothing. When any field is
      refused, nothing changes and the 409 names every refused field in
      `errors`. Its code is `consignment-contents-fixed` when a field naming
      what the consignment carries is sent (weight, volume, chargeable
      weight, lines, material, hazardous flag, consignee or destination are
      fixed when it is generated: cancel it and generate it again instead),
      and `consignment-amendment-invalid` otherwise -- a field that cannot be
      amended, a value that is not text, too long, a malformed phone number,
      client reference or instant, or a window that ends before it starts. A
      client reference already on another consignment of the tenant is 409
      `client-reference-taken`.

      On success, each named field is reported APPLIED or UNCHANGED, and the
      new version is the `ETag`.
    parameters:
      - $ref: "#/components/parameters/ifMatch"
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ConsignmentAmendmentRequest" }
    responses:
      "200":
        description: Each named field's outcome, and the version now.
        headers:
          ETag:
            schema: { type: string }
            description: The consignment's version after the amendment, quoted.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsignmentAmended" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/consignments/amendments:
  post:
    tags: [Planning]
    operationId: amendConsignments
    summary: Amend many consignments' particulars, each on its own
    description: |
      1 to 200 items, each a consignment, the version its caller read, and the
      changes, judged exactly as one amendment is. Each item is amended or
      refused by itself, in its own transaction, and reported in the order
      asked: AMENDED with its fields and new version, or REFUSED with the code
      a single amendment would have answered (`not-found` for a consignment
      the caller cannot see). A consignment named twice is a 400. Needs
      `LOAD_CREATE`.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BulkAmendConsignmentsRequest" }
    responses:
      "200":
        description: Every item's outcome, in the order asked.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsignmentBulkResult" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/consignments/{id}/cancellation:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Planning]
    operationId: cancelConsignment
    summary: Cancel one consignment, leaving its order standing
    description: |
      Allowed while the consignment is PLANNED or ASSIGNED_TO_LOAD and before
      its load leaves. A consignment on a load is taken off it first: the load
      is restated from the freight left aboard, and cancelled (with its open
      offer and allocation withdrawn) when nothing is. The order lines it was
      cut from go back to the order to be planned again, and the order's
      status steps back to match. Audited as `CONSIGNMENT_CANCELLED` in the
      consignment's history, and announced as the `CONSIGNMENT_CANCELLED`
      webhook. Needs `LOAD_CREATE`.

      Refused with 409 and a code: `consignment-already-cancelled` for a
      repeat; `consignment-from-warehouse` for one carrying a warehouse
      handling unit, which only the warehouse may withdraw;
      `consignment-split` for a split consignment and
      `consignment-is-split-part` for one of its parts;
      `consignment-dispatched` once it, or the load it is on, has left;
      `load-has-active-trip` while a trip that is not cancelled is raised
      against its load.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CancelConsignmentRequest" }
    responses:
      "200":
        description: What the cancellation did, with the load's totals now.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsignmentCancellation" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/consignments/cancellations:
  post:
    tags: [Planning]
    operationId: cancelConsignments
    summary: Cancel many consignments, each on its own
    description: |
      1 to 200 distinct consignments, each cancelled or refused by itself, in
      its own transaction, exactly as one cancellation is, and reported in the
      order asked: CANCELLED, or REFUSED with the code a single cancellation
      would have answered (`not-found` for a consignment the caller cannot
      see). A consignment named twice is a 400. Needs `LOAD_CREATE`.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BulkCancelConsignmentsRequest" }
    responses:
      "200":
        description: Every item's outcome, in the order asked.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsignmentBulkResult" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/consignments/by-tracking-ref/{trackingRef}:
