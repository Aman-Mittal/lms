        in: query
        required: false
        schema: { type: string, format: uuid }
        description: |
          Only the consignments cut from this order: how a large order's
          consignments are found together to be put on one load. An unknown
          order, or another tenant's, is an empty page.
      - $ref: "#/components/parameters/q"
    responses:
      "200":
        description: One page of unassigned consignments.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsignmentSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }

