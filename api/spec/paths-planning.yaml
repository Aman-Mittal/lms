/api/v1/consignments/{id}/split:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  post:
    tags: [Planning]
    operationId: splitConsignment
    summary: Split a consignment across several vehicles
    description: |
      Replaces a planned full truckload too big for one vehicle with parts,
      each an ordinary full-truckload consignment with its own reference, to go
      on its own load. Every part goes to the same consignee and destination
      under the same order, with the same material classes and dangerous-goods
      flag. The chargeable weight is shared in proportion to dead weight. The
      consignment becomes SPLIT and is never loaded, delivered, billed or
      cancelled again; its order is fulfilled when its parts are delivered.

      Refused with 409 and a code: `docket-cannot-be-split` for an LTL docket;
      `consignment-not-splittable` for anything not a PLANNED full truckload,
      for a part, and for a warehouse handling unit;
      `split-part-count-invalid` for fewer than 2 or more than 500 parts;
      `split-part-invalid` for a part without weight, with negative volume or
      with more than three decimals; `split-weights-do-not-add-up` and
      `split-volumes-do-not-add-up`, naming the difference.
    parameters:
      - $ref: "#/components/parameters/idempotencyKey"
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SplitConsignmentRequest" }
    responses:
      "201":
        description: The parts, in reference order.
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/ConsignmentPart" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }
      "409": { $ref: "#/components/responses/Conflict" }

/api/v1/consignments/{id}/parts:
  parameters:
    - name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Identifier of the resource.
  get:
    tags: [Planning]
    operationId: listConsignmentParts
    summary: The parts a consignment was split into
    description: |
      In reference order, keyed on the reference. Empty for a consignment
      that was never split.
    parameters:
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/q"
    responses:
      "200":
        description: One page of parts.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsignmentSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "404": { $ref: "#/components/responses/NotFound" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/consignments:
  get:
    tags: [Planning]
    operationId: listConsignments
    summary: Every consignment, by tracking reference
    description: |
      Consignments in any state, keyed on the tracking reference: what a desk
      picks from when it acts on one that has already moved. Requires any of
      `LOAD_READ`, `POD_READ`, `CLAIM_READ` or `TRACKING_LINK_MANAGE`, so the
      delivery, claims and tracking desks can find a consignment; a portal user
      sees only the consignments their partner is the customer of.
    parameters:
      - $ref: "#/components/parameters/status"
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/q"
    responses:
      "200":
        description: One page of consignments.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsignmentSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/consignments/unassigned:
  get:
    tags: [Planning]
    operationId: listUnassignedConsignments
    summary: Consignments not yet on a load
    parameters:
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
      - name: orderId
        in: query
        required: false
        schema: { type: string, format: uuid }
        description: |
          Only the consignments cut from this order: how a large order's
          consignments are found together to be put on one load. An unknown
          order, or another tenant's, is an empty page.
      - $ref: "#/components/parameters/q"
    responses:
      "200":
        description: One page of unassigned consignments.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsignmentSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/hubs/{terminalId}/dockets-awaiting-delivery:
  parameters:
    - name: terminalId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: The destination hub.
  get:
    tags: [Planning]
    operationId: listDocketsAwaitingDelivery
    summary: Dockets arrived at a hub and waiting for a delivery load
    description: |
      LTL dockets whose line haul has completed at this hub (status
      ARRIVED_AT_HUB), keyed on the docket number. Put them on a DELIVERY
      load opened at the hub to take them to their consignees.
    parameters:
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
    responses:
      "200":
        description: One page of dockets.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsignmentSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }

