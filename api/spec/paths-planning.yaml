    operationId: trackConsignment
    summary: Look a consignment up by its public tracking reference
    responses:
      "200":
        description: The consignment.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Consignment" }
      "401": { $ref: "#/components/responses/Unauthorized" }
