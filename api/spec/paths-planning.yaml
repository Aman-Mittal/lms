/api/v1/consignments:
  get:
    tags: [Planning]
    operationId: listConsignments
    summary: Every consignment, by tracking reference
    description: |
      Consignments in any state, keyed on the tracking reference: what a desk
      picks from when it acts on one that has already moved. Requires any of
      `LOAD_READ`, `POD_READ`, `CLAIM_READ` or `TRACKING_LINK_MANAGE`, so the
      delivery, claims and tracking desks can find a consignment; a portal user
      sees only the consignments their partner is the customer of.
    parameters:
      - $ref: "#/components/parameters/status"
      - $ref: "#/components/parameters/cursor"
      - $ref: "#/components/parameters/limit"
      - $ref: "#/components/parameters/q"
    responses:
      "200":
        description: One page of consignments.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsignmentSlice" }
      "401": { $ref: "#/components/responses/Unauthorized" }
      "403": { $ref: "#/components/responses/Forbidden" }
      "400": { $ref: "#/components/responses/BadRequest" }

/api/v1/consignments/unassigned:
  get:
    tags: [Planning]
    operationId: listUnassignedConsignments
    summary: Consignments not yet on a load
    parameters:
