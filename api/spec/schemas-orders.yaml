# A fragment of the API contract, spliced into api/openapi.yaml by the
# build -- see that file. $refs are relative to the assembled document.

Order:
  type: object
  properties:
    id: { type: string, format: uuid }
    orderNo: { type: string }
    status: { type: string }
    customerPartnerId: { type: string, format: uuid }
    customerName: { type: string }
    originTerminalCode: { type: string }
    originTerminalId:
      type: string
      format: uuid
      description: What an edit of the header restates, with the two hubs.
    originHubTerminalId: { type: string, format: uuid, description: The part-load origin hub; null for FTL. }
    destinationHubTerminalId: { type: string, format: uuid, description: The part-load destination hub; null for FTL. }
    freightMode: { type: string }
    plannedLineCount: { type: integer }
    totalDeadWeightKg: { type: number }
    totalChargeableWeightKg:
      type: number
      description: The greater of dead and volumetric weight, which is what
        freight is billed on.
    lineCount: { type: integer }
    containsHazmat: { type: boolean }
    requestedPickupAt: { type: string, format: date-time }
    requestedDeliveryAt: { type: string, format: date-time }
    createdAt: { type: string, format: date-time }
    version:
      type: integer
      format: int64
      description: The optimistic-lock version, also the `ETag`. Send it back in
        `If-Match` when editing the order.
    closeKind:
      $ref: "#/components/schemas/CloseKind"
    closeReason: { type: string, description: Why the order was closed, when a reason was given. }
    closedAt: { type: string, format: date-time }
    contractId:
      type: string
      format: uuid
      description: The client contract version in force on the order's date, which the order was resolved
        against; null when the customer had none.
    contractCode: { type: string }
    contractLaneId:
      type: string
      format: uuid
      description: The lane of that contract the order travels on; null for a direct order or before
        the order has lines.
    contractLaneCode: { type: string }
    loadType: { type: string, description: The load or vehicle type the order is booked for. }
    transitDays:
      type: integer
      description: |
        Days the movement is promised to take: the lane's transit days, else
        the straight-line distance between the order's origin and its
        farthest destination divided by the `order.transit.kmPerDay` setting,
        rounded up. Known once the order is validated (sooner when a chosen
        lane names days).
    expectedDeliveryDate:
      type: string
      format: date
      description: The requested pickup day (else the day the order was raised)
        plus `transitDays`; null while those are unknown.

OrderLine:
  type: object
  properties:
    id: { type: string, format: uuid }
    lineNo: { type: integer }
    materialCode: { type: string }
    materialDescription: { type: string }
    materialClass: { type: string }
    hazmatUnCode: { type: string }
    quantity: { type: number }
    uom: { type: string }
    deadWeightKg: { type: number }
    volumetricWeightKg: { type: number }
    chargeableWeightKg: { type: number }
    consigneePartnerId: { type: string, format: uuid }
    consigneeName: { type: string }
    destinationTerminalId: { type: string, format: uuid }
    destinationTerminalCode: { type: string }
    planned: { type: boolean }
    lengthM:
      type: number
      description: The measurements, null together when never taken. An edit
        that restates the line set sends them back, or they are cleared.
    widthM: { type: number }
    heightM: { type: number }
    volumetricDivisor: { type: number }
    closeKind:
      $ref: "#/components/schemas/CloseKind"
    closeReason: { type: string }
    closedAt:
      type: string
      format: date-time
      description: When the line was closed, on its own or with its order; null while open.
    cancelled:
      type: boolean
      description: Cancelled on its own; it no longer counts towards the
        order's lines, weight, coverage or credit exposure.

CloseKind:
  type: string
  description: |
    How an order or line was closed. `NORMAL`: everything was carried.
    `SHORT`: the unplanned remainder will not be. `FORCE`: closed whatever the
    freight was doing. `AUTO`: closed by the platform, the remainder being
    within the tenant's tolerance (never accepted in a request). Null while
    the order or line is open.
  enum: [NORMAL, SHORT, FORCE, AUTO]

CloseOrderRequest:
  type: object
  properties:
    kind:
      $ref: "#/components/schemas/CloseKind"
    reason:
      type: string
      maxLength: 500
      description: Why. Required for `SHORT` and `FORCE`; kept in the audit trail.

OrderCloseSettings:
  type: object
  properties:
    tolerancePercent:
      type: number
      description: Share of an order's total line quantity that may be left
        unplanned when its last consignment is delivered for the order still to
        close by itself.
    autoFulfil:
      type: boolean
      description: False when delivering the last consignment leaves the order open.
    customised:
      type: boolean
      description: False while the tenant has set nothing and the defaults apply.

SetOrderCloseSettingsRequest:
  type: object
  properties:
    tolerancePercent: { type: number, minimum: 0, maximum: 100 }
    autoFulfil: { type: boolean }
  required: [tolerancePercent, autoFulfil]

OrderLineCancellation:
  type: object
  properties:
    lineId: { type: string, format: uuid }
    cancelledConsignmentIds:
      type: array
      description: The consignments cancelled with the line; empty when it was on none.
      items: { type: string, format: uuid }
    releasedLineIds:
      type: array
      description: Other lines of the order that were on a cancelled
        consignment, now waiting to be planned again.
      items: { type: string, format: uuid }
  required: [lineId, cancelledConsignmentIds, releasedLineIds]

CancelOrderRequest:
  type: object
  properties:
    reason:
      type: string
      maxLength: 500
      description: Why the order is cancelled, kept in the audit trail. Optional.

RaiseOrderRequest:
  type: object
  properties:
    orgUnitId: { type: string, format: uuid }
    customerPartnerId: { type: string, format: uuid }
    orderNo:
      type: string
      description: The order's number, unique within the tenant (`order-no-taken`
        otherwise). Optional; when omitted or blank the next number of the
        tenant's sequence is assigned, `ORD-<year>-<000001>`.
    originTerminalId: { type: string, format: uuid }
    requestedPickupAt: { type: string, format: date-time }
    requestedDeliveryAt: { type: string, format: date-time }
    source: { type: string, enum: [MANUAL, API, EDI, PORTAL] }
    freightMode:
      $ref: "#/components/schemas/FreightMode"
    originHubTerminalId:
      type: string
      format: uuid
      description: Required for LTL, where each consignment becomes a docket
        consolidated at this hub. Refused for FTL. Must be a terminal of
        functional category HUB, or the order is refused with
        `ltl-hub-not-a-hub`.
    destinationHubTerminalId:
      type: string
      format: uuid
      description: Required for LTL, refused for FTL. Must be a HUB terminal,
        as the origin hub must.
    contractLaneId:
      type: string
      format: uuid
      description: |
        A lane of the contract version in force for the customer on the order's
        date (its requested pickup day, else today), chosen at the order desk
        from `GET /client-billing/clients/{clientId}/contract-lanes`. It must
        start at `originTerminalId` and carry the order's mode and load type
        (`order-outside-contract-lanes`, `order-load-type-not-allowed`). Left
        out, the contract's lane is found when the order is validated, from
        its lines.
    loadType:
      type: string
      maxLength: 60
      description: |
        The load or vehicle type the order is booked for (stored upper case).
        With a contract in force it must be one the contract lists
        (`order-load-type-not-allowed`); a contract that lists none covers all.
  required: [orgUnitId, customerPartnerId, originTerminalId]

AddOrderLineRequest:
  type: object
  description: |
    The three dimensions are optional together. Volumetric weight is only
    meaningful with all three, and a partly dimensioned line would be billed
    on dead weight while looking as though it had been measured.
  properties:
    lineNo: { type: integer, minimum: 1 }
    materialCode: { type: string }
    materialDescription: { type: string }
    materialClass: { type: string }
    hazmatUnCode: { type: string }
    quantity: { type: number, exclusiveMinimum: 0 }
    uom: { type: string }
    deadWeightKg: { type: number, exclusiveMinimum: 0 }
    lengthM: { type: number }
    widthM: { type: number }
    heightM: { type: number }
    volumetricDivisor: { type: number }
    consigneePartnerId: { type: string, format: uuid }
    destinationTerminalId: { type: string, format: uuid }
  required: [lineNo, materialCode, materialDescription, materialClass, quantity, uom, deadWeightKg, destinationTerminalId]

UpdateOrderRequest:
  type: object
  description: |
    The editable header of an order, stated whole: a pickup or delivery left out
    is cleared, not kept. The order number, organisational unit, source and
    freight mode never change. The hubs follow the order's mode: both for LTL
    (each a HUB terminal), none for FTL.
  properties:
    customerPartnerId: { type: string, format: uuid }
    originTerminalId: { type: string, format: uuid }
    requestedPickupAt: { type: string, format: date-time }
    requestedDeliveryAt: { type: string, format: date-time }
    originHubTerminalId: { type: string, format: uuid }
    destinationHubTerminalId: { type: string, format: uuid }
    contractLaneId:
      type: string
      format: uuid
      description: |
        A lane of the contract version in force for the customer on the order's
        date (its requested pickup day, else today), chosen at the order desk
        from `GET /client-billing/clients/{clientId}/contract-lanes`. It must
        start at `originTerminalId` and carry the order's mode and load type
        (`order-outside-contract-lanes`, `order-load-type-not-allowed`). Left
        out, the contract's lane is found when the order is validated, from
        its lines.
    loadType:
      type: string
      maxLength: 60
      description: |
        The load or vehicle type the order is booked for (stored upper case).
        With a contract in force it must be one the contract lists
        (`order-load-type-not-allowed`); a contract that lists none covers all.
  required: [customerPartnerId, originTerminalId]

ReplaceOrderLinesRequest:
  type: object
  properties:
    lines:
      type: array
      minItems: 1
      items: { $ref: "#/components/schemas/AddOrderLineRequest" }
  required: [lines]

AmendOrderRequest:
  type: object
  description: Either part may be left out to keep it as it is, but not both.
  properties:
    header: { $ref: "#/components/schemas/UpdateOrderRequest" }
    lines:
      type: array
      minItems: 1
      description: The complete replacement set of lines.
      items: { $ref: "#/components/schemas/AddOrderLineRequest" }

OrderSlice:
  type: object
  description: One page. No total and no page number -- both need the scan
    keyset pagination exists to avoid.
  properties:
    items:
      type: array
      items: { $ref: "#/components/schemas/Order" }
    nextCursor:
      type: string
      description: Pass as `cursor` for the next page. Null on the last.
    hasMore: { type: boolean }
  required: [items, hasMore]
