      summary: Nominate the vehicle and driver
      description: |
        Compliance is checked here as well as at dispatch. A lorry whose
        insurance lapses on Tuesday assigned to a Wednesday departure fails now,
        while there is time to find another.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignTripRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/trips/{id}/documents:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identifier of the resource.
    post:
      tags: [Trips]
      operationId: attachTripDocument
      summary: Attach a statutory document to the trip
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachTripDocumentRequest" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/trips/{id}/gate-in:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identifier of the resource.
    post:
      tags: [Trips]
      operationId: gateIn
      summary: Record arrival at the origin. The detention clock starts here.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GateInRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/trips/{id}/weighings:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identifier of the resource.
    post:
      tags: [Trips]
      operationId: recordWeighing
      summary: Record a weighbridge ticket
      description: |
        The tare must be taken before the gross. The other way round means the
        'tare' was measured with freight aboard, and the payload computed from
        it is quietly wrong rather than obviously wrong.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WeighingRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/trips/{id}/loaded:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identifier of the resource.
    post:
      tags: [Trips]
      operationId: markLoaded
      summary: Loading is finished and the vehicle weighed laden
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilestoneRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/trips/{id}/dispatch:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identifier of the resource.
    post:
      tags: [Trips]
      operationId: dispatchTrip
      summary: The compliance gate
      description: |
        Four checks, reported together so a dispatcher standing at a gate with a
        driver waiting learns everything that is wrong in one go: the trip's own
        statutory documents, the vehicle's and driver's documents against the
        departure date, hazmat certification where the load needs it, and the
        weighed payload against the manifest within tolerance.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilestoneRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/trips/{id}/in-transit:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identifier of the resource.
    post:
      tags: [Trips]
      operationId: beginTransit
      summary: Mark the trip moving
      description: |
        Normally driven by a geofence exit. This exists for the case telematics
        cannot cover: a vehicle with no working tracker still has to be
        dispatchable.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/trips/{id}/arrival:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identifier of the resource.
    post:
      tags: [Trips]
      operationId: recordArrival
      summary: Mark the trip at its destination
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilestoneRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/trips/{id}/completion:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identifier of the resource.
    post:
      tags: [Trips]
      operationId: completeTrip
      summary: Proof of delivery accepted
      description: |
        Raises the freight bill, priced against the rate card in force on the
        dispatch date.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilestoneRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/telematics/pings:
    post:
      tags: [Telematics]
      operationId: ingestPings
      summary: Ingest a batch of positions
      description: |
        Answers 202 with a report of what happened. Geofence crossings evaluated
        here drive the trip state machine: leaving the origin puts a trip in
        transit, entering the destination marks it arrived.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PingBatchRequest" }
      responses:
        "202":
          description: Accepted for processing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/telematics/positions:
    get:
      tags: [Telematics]
      operationId: listPositions
      summary: Where every vehicle was last seen
      responses:
        "200":
          description: Latest position per vehicle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehiclePosition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/telematics/positions/{vehicleId}:
    parameters:
      - name: vehicleId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identifier of the vehicle.
    get:
      tags: [Telematics]
      operationId: getPosition
      summary: Where one vehicle was last seen
      responses:
        "200":
          description: The latest position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehiclePosition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/telematics/trips/{tripId}/crossings:
    parameters:
      - name: tripId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identifier of the trip.
    get:
      tags: [Telematics]
      operationId: listCrossings
      summary: Geofence crossings recorded against a trip
      responses:
        "200":
          description: Crossings in order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GeofenceCrossing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/telematics/trips/{tripId}/track:
    parameters:
      - name: tripId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identifier of the trip.
    get:
      tags: [Telematics]
      operationId: getTrack
      summary: The shape of a trip's journey
      description: |
        Raw points while the trip runs, the simplified polyline once retention
        has collapsed it. The caller cannot tell which and should not need to.
      responses:
        "200":
          description: "`[lon, lat]` pairs, GeoJSON order."
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items: { type: number }
                  minItems: 2
                  maxItems: 2
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/telematics/trips/{tripId}/progress:
    parameters:
      - name: tripId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identifier of the trip.
    get:
      tags: [Telematics]
      operationId: getProgress
      summary: How far along a trip is
      responses:
        "200":
          description: Progress and an estimated arrival.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripProgress" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/telematics/deviations:
    get:
      tags: [Telematics]
      operationId: listOpenDeviations
      summary: Vehicles currently off their corridor
      responses:
        "200":
          description: Open deviations.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Deviation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/freight-bills:
    get:
      tags: [Settlement]
      operationId: listFreightBills
      summary: A page of freight bills
      parameters:
        - $ref: "#/components/parameters/status"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: One page of bills.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FreightBillSlice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/freight-bills/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identifier of the resource.
    get:
      tags: [Settlement]
      operationId: getFreightBill
      summary: One bill
      description: |
        There is no endpoint to create one. A bill is raised when a trip
        completes, because pricing depends on the dispatch date and the origin
        dwell -- facts the movement produces, not facts a caller supplies.
      responses:
        "200":
          description: The bill.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FreightBill" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/freight-bills/{id}/lines:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identifier of the resource.
    get:
      tags: [Settlement]
      operationId: getFreightBillLines
      summary: The arithmetic behind the total
      description: |
        A bill carrying only a total is unarguable. These lines are the entire
        content of the conversation that follows a dispute.
      responses:
        "200":
          description: Lines in order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FreightBillLine" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/freight-bills/{id}/match:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identifier of the resource.
    post:
      tags: [Settlement]
      operationId: matchFreightBill
      summary: Record the vendor's invoice and settle it
      description: |
        Approved when the difference is within the greater of a percentage and
        an absolute floor; disputed otherwise. An underclaim beyond tolerance is
        disputed too -- it means the two sides' understanding of the rate has
        diverged, and next month it points the other way.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchRequest" }
      responses:
        "200":
          description: What the comparison settled to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/freight-bills/{id}/resolve:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identifier of the resource.
    post:
      tags: [Settlement]
      operationId: resolveDispute
      summary: Settle a dispute in the vendor's favour, on the record
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveDisputeRequest" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/tariffs:
    post:
      tags: [Settlement]
      operationId: publishTariff
      summary: Publish a rate card version
      description: |
        POST only, and that is the contract rather than an omission. A rate card
        is a version: correcting one means publishing a successor, which closes
        the incumbent. The database refuses an edit by trigger, so the API does
        not offer one.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishTariffRequest" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/tariffs/{id}/slabs:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Identifier of the resource.
    post:
      tags: [Settlement]
      operationId: addTariffSlab
      summary: Add a weight band to an open rate card
      description: |
        Refused once the card has been superseded: adding a band to a closed
        version would change what already-priced movements cost without touching
        a single bill.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddSlabRequest" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/tariffs/fuel-surcharges:
    post:
      tags: [Settlement]
      operationId: recordFuelSurcharge
      summary: Record the fuel surcharge for a month
      description: |
        A stored figure rather than a price feed. An external dependency on the
        pricing path means invoices that cannot be raised because somebody
        else's service is down.
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FuelSurchargeRequest" }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
