# Disaster-recovery stack: PostgreSQL 17 archiving every WAL segment to a
# pgBackRest repository, for backups, point-in-time restore and the restore
# drill. Driven by the scripts beside this file (see README.md); in short:
#
#   deploy/dr/init-env.sh                       # once: generate secrets
#   docker compose -f deploy/dr/docker-compose.dr.yml up -d --build --wait
#   deploy/dr/backup.sh full
#
# With an S3-compatible repository instead of the local volume:
#
#   DR_REPO_TYPE=s3 docker compose -f deploy/dr/docker-compose.dr.yml \
#       --profile s3 up -d --build --wait
#
# Independent of deploy/docker-compose.yml: it is its own compose project with
# its own volumes, so a drill can never touch the development database.

name: lms-dr

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    image: lms-dr-postgres:17.7-pgbackrest
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      # No password, as in deploy/docker-compose.yml and for the same reasons:
      # a throwaway local database, bound to loopback only, and nothing
      # credential-shaped committed to a public repository. The secrets this
      # stack does need (the repository passphrase, the object-store keys) are
      # generated per machine by init-env.sh and mounted as files below.
      POSTGRES_HOST_AUTH_METHOD: trust
      DR_REPO_TYPE: ${DR_REPO_TYPE:-posix}
      # Only read with DR_REPO_TYPE=s3; the defaults are the objectstore
      # service below. See entrypoint.sh for an external S3 service.
      DR_S3_ENDPOINT: ${DR_S3_ENDPOINT:-objectstore}
      DR_S3_PORT: ${DR_S3_PORT:-8333}
      DR_S3_BUCKET: ${DR_S3_BUCKET:-lms-dr}
      DR_S3_REGION: ${DR_S3_REGION:-us-east-1}
      DR_S3_URI_STYLE: ${DR_S3_URI_STYLE:-path}
      DR_S3_CA_FILE: ${DR_S3_CA_FILE-/run/secrets/s3_tls_cert}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=lms archive-push %p
      # A partly filled segment is archived after at most a minute, which is
      # what bounds the recovery point on a quiet database: RPO <= 60 s plus
      # the time to push one segment, far inside the 5-minute objective.
      - -c
      - archive_timeout=60s
      - -c
      - max_wal_senders=3
    ports:
      # Loopback only: trust authentication makes the bind address the whole
      # access-control model. A different port from the development stack so
      # both can run side by side. Set DR_PG_PORT empty for a random port (the
      # drill does, so it never collides with anything already listening).
      - "127.0.0.1:${DR_PG_PORT-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbackrest-repo:/var/lib/pgbackrest
    secrets:
      - repo_cipher_pass
      - s3_access_key
      - s3_secret_key
      - s3_tls_cert
    healthcheck:
      # Over TCP: the official entrypoint's initialisation server listens on
      # the socket only, so a socket probe can report ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lms -d lms"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  # S3-compatible object store for the optional S3 repository. SeaweedFS
  # (Apache-2.0) rather than MinIO, whose images are no longer published and
  # whose AGPL licence sits outside this project's licence policy. pgBackRest
  # speaks S3 over TLS only, so it serves a self-signed certificate generated by
  # init-env.sh. Not published on the host: only the database reaches it.
  objectstore:
    profiles: ["s3"]
    image: chrislusf/seaweedfs:4.48
    # The image's entrypoint drops to its own `seaweed` user, which cannot
    # read the secrets: compose mounts them with the host owner and mode 600.
    # This object store is the drill's and a development stand-in, so weed
    # runs directly, as the container's root, rather than widening the
    # secrets' permissions on the host.
    entrypoint: ["/usr/bin/weed", "-logtostderr=true"]
    command:
      - server
      - -dir=/data
      - -master.volumeSizeLimitMB=256
      - -volume.max=16
      - -s3
      - -s3.port=8333
      - -s3.config=/run/secrets/s3_config
      - -s3.cert.file=/run/secrets/s3_tls_cert
      - -s3.key.file=/run/secrets/s3_tls_key
    volumes:
      - objectstore-data:/data
    secrets:
      - s3_config
      - s3_tls_cert
      - s3_tls_key

volumes:
  pgdata:
  pgbackrest-repo:
  objectstore-data:

# Generated by init-env.sh into DR_SECRETS_DIR (default deploy/dr/secrets,
# git-ignored). Never committed; losing repo_cipher_pass loses the backups.
secrets:
  repo_cipher_pass:
    file: ${DR_SECRETS_DIR:-./secrets}/repo_cipher_pass
  s3_access_key:
    file: ${DR_SECRETS_DIR:-./secrets}/s3_access_key
  s3_secret_key:
    file: ${DR_SECRETS_DIR:-./secrets}/s3_secret_key
  s3_config:
    file: ${DR_SECRETS_DIR:-./secrets}/s3_config.json
  s3_tls_cert:
    file: ${DR_SECRETS_DIR:-./secrets}/s3_tls.crt
  s3_tls_key:
    file: ${DR_SECRETS_DIR:-./secrets}/s3_tls.key
