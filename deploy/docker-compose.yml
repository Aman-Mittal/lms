# The whole stack, locally, with one command:
#
#   docker compose -f deploy/docker-compose.yml up
#
# Defaults to the JVM build because it compiles in seconds. To exercise the
# artefact that actually ships, add the native profile:
#
#   docker compose -f deploy/docker-compose.yml --profile native up

name: lms

services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      # Overridable from deploy/.env. The default keeps `docker compose up`
      # a single command, and is a throwaway local credential -- this
      # database is created and destroyed on a developer's machine and is
      # never reachable from anywhere else.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - lms

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: jvm
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/lms
      DATABASE_USERNAME: lms
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      LOG_LEVEL_APP: DEBUG
      PORT: 8080
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - lms

  # Parity check against the artefact that actually deploys. Slow to build.
  backend-native:
    profiles: ["native"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: native
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/lms
      DATABASE_USERNAME: lms
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      PORT: 8080
    ports:
      - "${BACKEND_NATIVE_PORT:-8081}:8080"
    # Mirrors the Render free instance so local behaviour matches production.
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lms

volumes:
  postgres-data:

networks:
  lms:
    driver: bridge
