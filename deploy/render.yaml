# Render blueprint.
#
# The service is image-backed: CI builds the native image on a 16 GB GitHub
# Actions runner and publishes it to GHCR as a PUBLIC package. Render pulls it
# directly, which means no registry credential is needed at all -- no PAT to
# provision, scope, or rotate.
#
# Two free-tier facts this file is shaped around:
#   * The web service sleeps after 15 minutes of inactivity. The native image
#     makes the wake-up cheap; a JVM image would not.
#   * The free Postgres EXPIRES 30 DAYS AFTER CREATION. Re-provisioning is
#     expected, which is why migrations and demo seed data must be idempotent
#     and must run unattended on startup.

services:
  - type: web
    name: lms-platform
    runtime: image
    plan: free
    region: oregon
    image:
      url: ghcr.io/aman-mittal/lms:latest
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: PORT
        value: 8080

      # Render injects the connection string; the app maps it to JDBC form.
      - key: DATABASE_URL
        fromDatabase:
          name: lms-postgres
          property: connectionString

      # Sized for 0.1 CPU against a small Postgres. Raising these buys
      # contention, not throughput.
      - key: DB_POOL_MAX
        value: "5"
      - key: TOMCAT_THREADS_MAX
        value: "20"

      # The Angular console is served from GitHub Pages -- a different origin.
      - key: CORS_ALLOWED_ORIGINS
        value: https://aman-mittal.github.io

      # RS256 keypair. Generate once and set both as secrets in the Render
      # dashboard; never commit them. See deploy/.env.example for how to mint
      # a pair. `sync: false` keeps them out of this file and out of git.
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false

      - key: LOG_LEVEL_APP
        value: INFO

      # The 1 GB database cannot hold telematics history indefinitely.
      - key: PING_RETENTION_DAYS
        value: "7"

databases:
  - name: lms-postgres
    plan: free
    databaseName: lms
    user: lms
