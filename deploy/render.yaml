# Render blueprint.
#
# The service is image-backed: CI builds the native image on a 16 GB GitHub
# Actions runner and publishes it to GHCR as a PUBLIC package. Render pulls it
# directly, which means no registry credential is needed at all -- no PAT to
# provision, scope, or rotate.
#
# Two free-tier facts this file is shaped around:
#   * The web service sleeps after 15 minutes of inactivity. The native image
#     makes the wake-up cheap; a JVM image would not.
#   * Render's own free Postgres EXPIRES 30 DAYS AFTER CREATION and takes the
#     data with it, so this Blueprint does not create one. DATABASE_URL is a
#     secret you set to an external Postgres (Neon, Supabase, ...); see
#     deploy/README.md. Migrations and demo seed data are idempotent and run
#     unattended on startup, so a replaced database rebuilds itself.

services:
  - type: web
    name: lms-platform
    runtime: image
    plan: free
    region: oregon
    image:
      url: ghcr.io/aman-mittal/lms:latest
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: PORT
        value: 8080

      # The external Postgres connection string, set in the Render dashboard
      # (postgresql://user:password@host:port/db?sslmode=require). The app maps
      # it to JDBC form. `sync: false` keeps it out of this file and out of git.
      - key: DATABASE_URL
        sync: false

      # Sized for 0.1 CPU against a small Postgres. Raising these buys
      # contention, not throughput.
      - key: DB_POOL_MAX
        value: "5"
      - key: TOMCAT_THREADS_MAX
        value: "20"

      # The Angular console is served from GitHub Pages -- a different origin.
      - key: CORS_ALLOWED_ORIGINS
        value: https://aman-mittal.github.io

      # RS256 keypair. Generate once and set both as secrets in the Render
      # dashboard; never commit them. See deploy/.env.example for how to mint
      # a pair. `sync: false` keeps them out of this file and out of git.
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false

      - key: LOG_LEVEL_APP
        value: INFO
      - key: LOG_FORMAT
        value: ecs

      # A fresh free-tier database has no tenant and no user, so nobody could
      # sign in. This seeds a "demo" tenant and one administrator on every
      # start (idempotently, so a replaced database rebuilds itself).
      # Render generates the password once; read it from the service's
      # Environment tab. Sign in with tenant "demo", admin@demo.local.
      - key: LMS_DEMO_SEED
        value: "true"
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true

      # The 1 GB database cannot hold telematics history indefinitely.
      - key: PING_RETENTION_DAYS
        value: "7"
