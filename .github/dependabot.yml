version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    # A week between a version being published and Dependabot proposing it.
    #
    # The tj-actions/changed-files compromise reached thousands of repositories
    # because automation pulled a malicious release within minutes of its
    # publication. A cooldown does not make a bad version good; it buys the
    # window in which somebody else notices, which is the only defence a
    # project this size actually has. Security advisories are exempt from
    # cooldown by design, so patches for known vulnerabilities still arrive
    # immediately.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework*"
      test-tooling:
        patterns:
          - "org.testcontainers*"
          - "org.junit*"
          - "org.assertj*"
    commit-message:
      prefix: "deps"

  # Actions are pinned to full commit SHAs; Dependabot understands this and
  # updates the SHA while preserving the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    # See the maven block above for why.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /deploy
    # See the maven block above for why.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "docker"
