# Static analysis of the workflows themselves. CI has write access to the
# package registry and runs on pull_request, so the workflow definitions are
# part of the attack surface, not just the code they build.

name: Zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # `regular` rather than `pedantic`. Pedantic is an auditor's setting:
          # it reports stylistic findings alongside real ones, and a security
          # gate that is red for style is a gate people learn to ignore --
          # which costs more than the findings are worth. The rules that
          # actually matter here (unpinned actions, credential persistence,
          # template injection, excessive permissions) are all in `regular`.
          persona: regular
          # SARIF upload needs code scanning to accept results from this
          # workflow. Left off so a permissions or configuration problem in the
          # upload cannot fail the audit itself.
          advanced-security: false
          # ...but "the findings are in the job log" was not good enough: the
          # Actions log is readable only by repository admins, so a red audit
          # told everybody else nothing but its exit code. Annotations put each
          # finding on the file and line in the pull request diff, where the
          # person who has to fix it is already looking. Mutually exclusive
          # with advanced-security, which is off above, and not the default.
          annotations: true
