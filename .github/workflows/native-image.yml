# Native image build and publish.
#
# Native compilation needs ~6-8 GB of RAM and upwards of ten minutes. It runs
# here, on a 16 GB runner, rather than on Render -- whose free build pipeline
# would struggle with it. The repository is public, so Actions minutes are
# unmetered and this can run on every push to main without rationing.
#
# The binary is compiled exactly once per run, inside `docker build`, and the
# image that comes out is the one that is smoke-tested and the one that is
# pushed. Compiling once on the runner for the smoke test and again in the
# image doubled the job's length and tested a binary that was never shipped.
#
# The resulting package is published PUBLIC, which is what lets Render pull it
# with no registry credential at all.

name: Native image

# The native build needs 6-8 GB and upwards of ten minutes. Running it on every
# pull request means every review waits for it, and a red native build blocks a
# change that has nothing to do with native compilation.
#
# So: always on main, because that is what gets published and deployed; on a
# pull request only when it is labelled `native`, which is how you ask for the
# check on a change that plausibly affects AOT -- a new reflective dependency, a
# configuration property, a Spring Data mapping.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

# On a pull request a newer push supersedes the run in progress. On main it
# must not: merges land minutes apart, a run takes longer than that, and
# cancelling meant no main build ever finished and nothing was published. A
# newer main push queues behind the running one instead.
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  # Lowercase, written out. github.repository is "Aman-Mittal/lms", and an OCI
  # repository name may not contain capitals -- buildx refuses the tag, after
  # a ten-minute native compile, and nothing is ever published. Expressions
  # have no lower(), and this must match the image deploy/render.yaml pulls.
  IMAGE_NAME: aman-mittal/lms
  LOCAL_TAG: lms-platform:ci

jobs:
  native-image:
    name: Build native image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'native')
    permissions:
      contents: read
      # Only this job writes packages, and only on main (see the push step).
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GraalVM Community Edition: GPLv2 WITH Classpath Exception. Oracle
      # GraalVM ships under the proprietary GFTC and would invalidate this
      # project's Apache-2.0 distribution -- see DOCS/adr/0003. The compiler
      # now runs inside the Dockerfile's builder stage, so that pin is what
      # is checked.
      - name: Confirm the builder is GraalVM Community Edition
        run: |
          if ! grep -Eq '^ARG NATIVE_BUILDER_IMAGE=ghcr\.io/graalvm/native-image-community@sha256:[0-9a-f]{64}$' deploy/Dockerfile; then
            echo "::error::deploy/Dockerfile must pin the native builder to ghcr.io/graalvm/native-image-community by digest (DOCS/adr/0003)."
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The one native compile. Layer cache is read and written only on main:
      # GitHub scopes caches by ref, and keeping pull requests out of it
      # entirely means nothing a pull request builds can reach the image that
      # main publishes.
      - name: Build the native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: native
          load: true
          push: false
          tags: ${{ env.LOCAL_TAG }}
          cache-from: ${{ github.ref == 'refs/heads/main' && 'type=gha' || '' }}
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      - name: Report image size
        run: |
          SIZE=$(docker image inspect "$LOCAL_TAG" --format '{{.Size}}' | numfmt --to=iec)
          echo "Native image: ${SIZE}" >> "$GITHUB_STEP_SUMMARY"

      # A binary that cannot start is not a build success. This catches the
      # classic native-image failure mode -- missing reflection metadata that
      # only surfaces at runtime -- before anything is published, and it runs
      # the container that will be pushed, not a look-alike.
      - name: Smoke test the image
        run: |
          # Trust authentication, matching deploy/docker-compose.yml. A
          # throwaway container on a runner that is destroyed minutes later has
          # no access control worth the name, and saying so is more honest than
          # a published password that implies otherwise -- and does not leave a
          # credential-shaped string in the repository for a scanner to find.
          docker run -d --name pg -e POSTGRES_DB=lms -e POSTGRES_USER=lms \
            -e POSTGRES_HOST_AUTH_METHOD=trust -p 5432:5432 postgres:17.7-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U lms -d lms && break || sleep 2
          done

          # The demo seed is switched on with a password minted for this run
          # only, so the smoke script can sign in exactly as a visitor to the
          # Render deployment would. Readiness alone is not enough: a native
          # binary missing reflection metadata starts, reports UP, and then
          # answers 500 to the first JSON it has to write.
          export DEMO_ADMIN_PASSWORD="$(openssl rand -hex 16)"
          docker run -d --name app --network host \
            -e DATABASE_URL=jdbc:postgresql://localhost:5432/lms \
            -e DATABASE_USERNAME=lms -e DATABASE_PASSWORD= -e PORT=8080 \
            -e LMS_DEMO_SEED=true -e DEMO_ADMIN_PASSWORD \
            "$LOCAL_TAG"

          status=0
          BASE_URL=http://localhost:8080 READY_TIMEOUT_SECONDS=60 bash deploy/smoke.sh || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::The native image failed the smoke test."
            docker logs app 2>&1 | tail -n 200
          fi
          docker rm -f app pg >/dev/null 2>&1 || true
          exit "$status"

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the build above, so every layer -- the native compile
      # included -- comes from the builder's cache: this step pushes what was
      # just smoke-tested rather than building anything new.
      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: native
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha

      - name: Publishing reminder
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        # The reference is passed in as an environment variable rather than
        # interpolated into the script. A `${{ }}` expansion is textual
        # substitution into the shell source before it runs, so the safe habit
        # is never to do it inside a run block -- and it is the habit, not the
        # judgement call, that protects the one value that is not
        # workflow-controlled.
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          {
            echo "### Published"
            echo ""
            echo "\`$IMAGE_REF\`"
            echo ""
            echo "The GHCR package must be set to **public** for Render to pull it"
            echo "without a registry credential. This is a one-time setting in the"
            echo "package's settings page; a private package will fail the deploy."
          } >> "$GITHUB_STEP_SUMMARY"
