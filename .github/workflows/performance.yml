# The performance suite: tests tagged `performance`, excluded from every
# other build because they are slow by design.
#
#   * LargeDataQueryPerformanceTest bulk-loads hundreds of thousands of rows
#     across two tenants and times the hot queries under row-level security,
#     asserting above all that a deep keyset page costs what the first does.
#   * PodRestartResilienceTest stops and starts the real application against
#     one database: an outbox event a dead pod never finished is republished
#     and applied by the next, and an idempotent retry after a restart gets
#     the original answer.
#
# Weekly, and on demand -- and on a pull request labelled `performance`, for
# a change that plausibly affects a query plan or the outbox.

name: Performance

on:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"

jobs:
  performance:
    name: Performance suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'performance')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run the performance suite
        working-directory: backend
        run: ./mvnw -B -ntp verify -Pperformance

      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: performance-reports
          path: backend/target/surefire-reports/
          retention-days: 30
