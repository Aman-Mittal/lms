# Browser end-to-end tests: the Angular and React consoles in a real browser,
# talking to the real backend and a real database.
#
# Nothing is mocked. A Postgres service, the backend jar started with the demo
# tenant seeded, the consoles built and served as they are published, and
# Playwright driving Chromium through the same specs against each console.
#
# The backend's own end-to-end suite (Gherkin over HTTP) runs with the rest of
# the Java tests in CI; this is the half that starts at the screen.

name: End-to-end

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'backend/**', 'api/**', '.github/workflows/e2e.yml']
  pull_request:
    branches: [main]
    paths: ['frontend/**', 'backend/**', 'api/**', '.github/workflows/e2e.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  browser:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_DB: lms
          POSTGRES_USER: lms
          # No password, as in deploy/docker-compose.yml: a throwaway database
          # on a runner that is destroyed with the job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The demo administrator's password is made up for this run and never
      # written down: nothing here is a credential, and a literal would read
      # like one to a secret scanner.
      - name: Make up a password for the demo administrator
        run: echo "E2E_DEMO_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Build the backend
        working-directory: backend
        run: ./mvnw -B -ntp -q -DskipTests package

      - name: Start the backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/lms
          LMS_DEMO_SEED: "true"
          DEMO_ADMIN_PASSWORD: ${{ env.E2E_DEMO_PASSWORD }}
          CORS_ALLOWED_ORIGINS: http://localhost:4300
        run: |
          nohup java -jar backend/target/lms-platform-*.jar > backend.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health/readiness > /dev/null; then
              echo "backend ready after $((i * 2)) seconds"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become ready" >&2
          tail -50 backend.log >&2
          exit 1

      - name: Build the consoles against it
        working-directory: frontend
        env:
          PAGES_BASE: /
          API_URL: http://localhost:8080
        run: bash build-site.sh

      - name: Install the browser
        working-directory: frontend/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run the browser tests
        working-directory: frontend/e2e
        run: npx playwright test

      - name: Keep the evidence of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure
          path: |
            frontend/e2e/playwright-report
            frontend/e2e/test-results
            backend.log
          if-no-files-found: ignore
