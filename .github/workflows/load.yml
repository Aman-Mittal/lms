# Load tests with Apache JMeter against a throwaway stack: Postgres and the
# backend jar started on the runner, then the mixed read/write plan, judged by
# the same error-rate and 95th-percentile limits as the manual run.
#
# Two jobs. `single` drives the plan from one JMeter JVM. `distributed` drives
# it from a controller and three workers over RMI (performance/jmeter/
# run-distributed.sh), so the load is workers x users and the merged result is
# judged as one. Each is a pass/fail gate, not a number to read.
#
# The deployed-instance run (jmeter.yml) stays separate: it needs a target and a
# secret, and waking a free instance is not something to do on every change.
#
# On demand, weekly, and on a pull request labelled `load` -- for a change that
# plausibly moves latency under concurrency.

name: Load

on:
  schedule:
    - cron: "41 3 * * 2"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      threads:
        description: Virtual users (per worker, for the distributed run)
        required: true
        default: "10"
      duration_seconds:
        description: How long to hold the load
        required: true
        default: "60"
      max_p95_ms:
        description: Fail the run above this 95th percentile, in milliseconds
        required: true
        default: "2000"

permissions:
  contents: read

concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: true

env:
  JMETER_VERSION: "5.6.3"
  # SHA-512 of apache-jmeter-5.6.3.zip, as published by the Apache archive.
  JMETER_SHA512: "387fadca903ee0aa30e3f2115fdfedb3898b102e6b9fe7cc3942703094bd2e65b235df2b0c6d0d3248e74c9a7950a36e42625fd74425368342c12e40b0163076"

jobs:
  build:
    name: Build the backend
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'load')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Build the backend
        working-directory: backend
        run: ./mvnw -B -ntp -q -DskipTests package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-jar
          path: backend/target/lms-platform-*.jar
          retention-days: 1

  single:
    name: One JMeter, one machine
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_DB: lms
          POSTGRES_USER: lms
          # No password, as in deploy/docker-compose.yml: a throwaway database
          # on a runner that is destroyed with the job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-jar
          path: backend/target

      # The demo administrator's password is made up for this run and never
      # written down: nothing here is a credential, and a literal would read
      # like one to a secret scanner.
      - name: Make up a password for the demo administrator
        run: echo "LOAD_DEMO_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Start the backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/lms
          LMS_DEMO_SEED: "true"
          DEMO_ADMIN_PASSWORD: ${{ env.LOAD_DEMO_PASSWORD }}
        run: |
          nohup java -Xmx512m -jar backend/target/lms-platform-*.jar > backend.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health/readiness > /dev/null; then
              echo "backend ready after $((i * 2)) seconds"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become ready" >&2
          tail -50 backend.log >&2
          exit 1

      # Pinned and checked: a load tool is not one to take on trust from a mirror.
      - name: Install Apache JMeter
        run: |
          curl -sSfLo "$RUNNER_TEMP/jmeter.zip" \
            "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.zip"
          echo "${JMETER_SHA512}  $RUNNER_TEMP/jmeter.zip" | sha512sum --check -
          unzip -q "$RUNNER_TEMP/jmeter.zip" -d "$RUNNER_TEMP"
          echo "JMETER_BIN=$RUNNER_TEMP/apache-jmeter-${JMETER_VERSION}/bin/jmeter" >> "$GITHUB_ENV"

      # Inputs reach the script as environment variables, never by textual
      # substitution into the shell source.
      - name: Run performance/jmeter/run.sh
        env:
          BASE_URL: http://localhost:8080
          DEMO_ADMIN_PASSWORD: ${{ env.LOAD_DEMO_PASSWORD }}
          THREADS: ${{ inputs.threads || '10' }}
          DURATION_SECONDS: ${{ inputs.duration_seconds || '60' }}
          MAX_P95_MS: ${{ inputs.max_p95_ms || '2000' }}
          RESULTS_DIR: ${{ runner.temp }}/jmeter-single
        run: bash performance/jmeter/run.sh

      - name: Show the result
        if: always()
        env:
          RESULTS_DIR: ${{ runner.temp }}/jmeter-single
        run: |
          {
            echo '### JMeter, one machine'
            echo '```'
            cat "$RESULTS_DIR/summary.txt" 2>/dev/null || echo "no summary was written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jmeter-single
          path: |
            ${{ runner.temp }}/jmeter-single/
            backend.log
          retention-days: 14

  distributed:
    name: JMeter controller and three workers
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_DB: lms
          POSTGRES_USER: lms
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-jar
          path: backend/target

      - name: Make up a password for the demo administrator
        run: echo "LOAD_DEMO_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Start the backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/lms
          LMS_DEMO_SEED: "true"
          DEMO_ADMIN_PASSWORD: ${{ env.LOAD_DEMO_PASSWORD }}
        run: |
          nohup java -Xmx512m -jar backend/target/lms-platform-*.jar > backend.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health/readiness > /dev/null; then
              echo "backend ready after $((i * 2)) seconds"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become ready" >&2
          tail -50 backend.log >&2
          exit 1

      - name: Install Apache JMeter
        run: |
          curl -sSfLo "$RUNNER_TEMP/jmeter.zip" \
            "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.zip"
          echo "${JMETER_SHA512}  $RUNNER_TEMP/jmeter.zip" | sha512sum --check -
          unzip -q "$RUNNER_TEMP/jmeter.zip" -d "$RUNNER_TEMP"
          echo "JMETER_BIN=$RUNNER_TEMP/apache-jmeter-${JMETER_VERSION}/bin/jmeter" >> "$GITHUB_ENV"

      - name: Run performance/jmeter/run-distributed.sh
        env:
          BASE_URL: http://localhost:8080
          DEMO_ADMIN_PASSWORD: ${{ env.LOAD_DEMO_PASSWORD }}
          WORKERS: "3"
          # Per worker: three workers of four users put about as much load on
          # the backend as the single run's ten.
          THREADS: ${{ inputs.threads || '4' }}
          DURATION_SECONDS: ${{ inputs.duration_seconds || '60' }}
          MAX_P95_MS: ${{ inputs.max_p95_ms || '2000' }}
          RESULTS_DIR: ${{ runner.temp }}/jmeter-distributed
        run: bash performance/jmeter/run-distributed.sh

      - name: Show the result
        if: always()
        env:
          RESULTS_DIR: ${{ runner.temp }}/jmeter-distributed
        run: |
          {
            echo '### JMeter, controller and three workers'
            echo '```'
            cat "$RESULTS_DIR/summary.txt" 2>/dev/null || echo "no summary was written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jmeter-distributed
          path: |
            ${{ runner.temp }}/jmeter-distributed/
            backend.log
          retention-days: 14
