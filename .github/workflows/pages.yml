# The demo site: the Angular console, the React console and the API reference,
# published to GitHub Pages.
#
# Pull requests build the site but do not publish it, so a broken console or a
# contract change that breaks a generated client is caught before merge. Only a
# push to main deploys.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions". A workflow
# cannot switch that on with the token it is given.

name: Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'api/**', '.github/workflows/pages.yml']
  pull_request:
    branches: [main]
    paths: ['frontend/**', 'api/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Java twice over: Maven assembles the OpenAPI contract from its
      # fragments, and OpenAPI Generator is itself a jar.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Assemble the OpenAPI contract
        working-directory: backend
        run: ./mvnw -B -ntp -q generate-sources

      - name: Build the site
        working-directory: frontend
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: bash build-site.sh

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
