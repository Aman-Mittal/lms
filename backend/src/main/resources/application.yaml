# All configuration is 12-factor: every value below is overridable by an
# environment variable, and nothing environment-specific is baked into the image.

spring:
  application:
    name: lms-platform

  jackson:
    deserialization:
      # Jackson 3 turned this on; Jackson 2 (and every Spring Boot before 4)
      # had it off. On, a request that leaves out an optional primitive -- a
      # boolean flag such as hazmatEndorsed -- fails to deserialise, and an
      # empty object sent to any record with a primitive answered 500 before
      # bean validation could name the missing fields. Off, an absent
      # primitive is its zero value and validation does the refusing. A
      # primitive that must be supplied is declared as a boxed type with
      # @NotNull, so that omitting it is reported rather than read as zero.
      fail-on-null-for-primitives: false

  # Consumed by DataSourceConfig, which reads these from the Environment
  # directly rather than through @ConfigurationProperties binding. DATABASE_URL
  # may be supplied in libpq form; it is normalised to JDBC form at that point.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lms}
    # No default here: a non-blank default would beat the user in DATABASE_URL.
    # DataSourceConfig falls back to the URL's user, then to "lms".
    username: ${DATABASE_USERNAME:}
    # No default. A fallback password is a password: if DATABASE_PASSWORD is
    # ever unset in a deployed environment, a default would have the service
    # quietly try a guessable credential instead of refusing to start. Local
    # development gets its value from deploy/docker-compose.yml, and the tests
    # from Testcontainers.
    password: ${DATABASE_PASSWORD:}
    hikari:
      # Render's free Postgres is small and the web service has 0.1 CPU --
      # a large pool would buy contention, not throughput.
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN:1}
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 900000

  data:
    jdbc:
      # Pin the dialect. Detection opens a real database connection to read
      # metadata, which is impossible during AOT processing -- the native build
      # then fails deep in a chain starting at `jdbcDialect` and surfacing as
      # "Failed to determine a suitable driver class", an error that names the
      # driver but is really about dialect detection dragging the DataSource
      # into image-build time. The platform targets PostgreSQL only, so there
      # is nothing to detect.
      dialect: postgresql

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

  modulith:
    events:
      jdbc:
        schema-initialization:
          # Flyway owns the schema, including the event publication table.
          enabled: false
      republish-outstanding-events-on-restart: true

server:
  port: ${PORT:8080}
  # Behind Render's proxy every request would otherwise appear to come from the
  # proxy, and the public route's per-client limit would be one shared bucket.
  # `native` lets Tomcat honour X-Forwarded-For from trusted (private-range)
  # proxies only.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:20}
      min-spare: 2
    accept-count: 50
    max-connections: 200
  compression:
    enabled: true
    mime-types: application/json,application/problem+json

management:
  tracing:
    sampling:
      # Every request is sampled. At free-tier volumes there is nothing to gain
      # by sampling less, and a missing trace costs more than a cheap one.
      probability: ${TRACE_SAMPLE_RATE:1.0}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  # Structured JSON to stdout, as vision document 4.4 requires, so a log
  # aggregator can ingest it without Grok patterns. Boot 4 does this natively --
  # no logstash-logback-encoder, so nothing extra to license-audit or configure
  # for native image.
  #
  # Left unset in development, where human-readable output is worth more than
  # machine-readable; LOG_FORMAT=ecs is set in deployed environments.
  structured:
    format:
      console: ${LOG_FORMAT:}
  # MDC keys carried on every line: the correlation id, and the trace and span
  # ids if a tracer is present.
  include-application-name: true
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.lms: ${LOG_LEVEL_APP:INFO}
  pattern:
    correlation: "[${spring.application.name:},%X{correlationId:-},%X{traceId:-},%X{spanId:-}] "


lms:
  security:
    # RS256 keypair. In production both are injected as PEM strings.
    # In dev, an ephemeral keypair is generated at startup when these are absent.
    public-key: ${JWT_PUBLIC_KEY:}
    private-key: ${JWT_PRIVATE_KEY:}
    access-token-ttl: ${JWT_ACCESS_TTL:PT1H}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
  delivery:
    # How long a delivery code stays valid, and how many wrong tries it allows.
    otp-ttl-minutes: ${LMS_DELIVERY_OTP_TTL_MINUTES:15}
    otp-max-attempts: ${LMS_DELIVERY_OTP_MAX_ATTEMPTS:3}
    # Real delivery of the code is a notification, which is deferred. For a
    # demo the code is returned to the caller instead -- and only then, so it
    # follows the demo seed switch unless set on its own.
    expose-otp: ${LMS_DELIVERY_EXPOSE_OTP:${LMS_DEMO_SEED:false}}
  tracking:
    # The public tracking route needs no credential, so it is limited per client
    # address: this many requests in each window, in memory on this instance.
    rate-limit:
      requests: ${LMS_TRACKING_RATE_LIMIT:30}
      window-seconds: ${LMS_TRACKING_RATE_WINDOW_SECONDS:60}
  cors:
    # The Angular console is served from GitHub Pages, a different origin.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  telematics:
    ping-retention-days: ${PING_RETENTION_DAYS:7}
    max-batch-size: ${PING_MAX_BATCH:500}
    # Pings implying a speed above this are treated as GPS noise and discarded.
    max-plausible-speed-kmh: ${PING_MAX_SPEED_KMH:160}
    route-deviation-threshold-metres: ${ROUTE_DEVIATION_METRES:2000}
    # Stoppage detector: a trip in transit that stays within this radius of one
    # spot, outside every terminal, for this long raises a ticket.
    stoppage-radius-m: ${STOPPAGE_RADIUS_M:100}
    stoppage-threshold-minutes: ${STOPPAGE_THRESHOLD_MINUTES:45}
  execution:
    # How far a weighed payload may differ from the planned weight before
    # dispatch is refused. Not zero: weighbridges have a tolerance, pallets
    # absorb moisture, and a gate that refuses every load half a percent off
    # its manifest is a gate somebody switches off.
    weight-tolerance-pct: ${WEIGHT_TOLERANCE_PCT:5}
  multimodal:
    connection-sweep:
      # The timer of the missed-connection sweep (MissedConnectionSweep). On
      # by default; the acceptance suite turns it off and runs the sweep from
      # its steps, because its scenarios are timelines set in the past.
      enabled: ${MULTIMODAL_CONNECTION_SWEEP:true}
  finance:
    # A vendor invoice is approved for payment when it differs from the
    # computed cost by no more than the greater of these two. Both are needed:
    # the percentage alone disputes a rounding difference on a small bill, the
    # absolute alone waves through a five-figure gap on a large one.
    match-tolerance-pct: ${INVOICE_TOLERANCE_PCT:2}
    match-tolerance-absolute: ${INVOICE_TOLERANCE_ABS:100}
  demo:
    # Off by default. When on, every start ensures a "demo" tenant and one
    # administrator holding every permission (DemoTenantSeeder) -- the only way
    # to sign in to a fresh database, since tenants have no self-service
    # registration. There is deliberately no default password.
    enabled: ${LMS_DEMO_SEED:false}
    tenant-code: ${DEMO_TENANT_CODE:demo}
    admin-email: ${DEMO_ADMIN_EMAIL:admin@demo.local}
    admin-password: ${DEMO_ADMIN_PASSWORD:}
