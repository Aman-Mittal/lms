# Default glue for Cucumber runs that bypass the suites.
#
# RunAcceptanceTest and RunEndToEndTest each name their own glue, and each glue
# package has its own @CucumberContextConfiguration. A targeted run such as
# `-Dcucumber.features=src/test/resources/features/x.feature` goes to the
# Cucumber engine directly, though, which would scan the whole classpath, find
# both context classes and refuse to start. Pointing the default at the
# acceptance glue makes those runs work; the suites' own settings still win.
cucumber.glue=com.lms.acceptance
